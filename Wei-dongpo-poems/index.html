  "poems/01-hangzhou.md": `# 杭州

> 西子湖畔莫归客，醉看花下赏花人。

---

## 西湖春行

> 恰逢江南又仲春，春风桃花满杭城。
> 西子湖畔莫归客，醉看花下赏花人。

———丙午年·春·魏东坡

![西湖春行](../images/西湖春行.jpg)

### 赏析

气韵天成，如一幅流动的江南春画卷。

**起兴自然，有"邂逅"之趣**——"恰逢"二字立定全诗气韵，暗含不期而遇的欣然，顿生《诗经》"邂逅相遇，适我愿兮"的古典情致。"江南"，白居易诗里的"江南好，风景旧曾谙"。"又仲春"，一"又"字绾合永恒与刹那，既有"岁岁年年花相似"的轮回之思，亦藏晏殊"似曾相识燕归来"的微妙怅惘。

**意象并置，见唐人气象**——"春风桃花"四字，乃盛唐绝句经典语汇。更妙在"满杭城"三字破空而来，将王涯"满园春色"之庭院视角，升华为杜牧"千里莺啼"的城郭尺度，令画面顿生旷远之境。

**用典无痕，暗渡西子灵韵**——"西子湖畔"四字，轻点东坡"欲把西湖比西子"之典，然不着斧痕。"莫归"二字如琴弦乍裂，打破古典诗"日暮客愁新"的哀婉定式。不写游子思归，反作山水劝留，与《楚辞·招隐士》"王孙兮归来，山中兮不可久留"形成奇妙对仗。

**观照之妙，得庄禅真谛**——"醉看"非仅酒态，实乃"万物静观皆自得"的审美沉醉，暗合庄子"身与物化"之境。昔有陶渊明"悠然见南山"的静观，此则进乎"看人看花"的动观——诗人既在花外交融物我，复在境中反观自照。"赏花人"为大众游春的日常诗意，尤妙在"醉"字将欧阳修"醉翁之意不在酒"的文人意趣，化作对世俗欢愉的注视。

---

## 江南烟雨

> 青衫黛影烟雨寒，朝暮花落摇橹船。
> 知君故里春不晚，此身归隐去江南。

———乙巳年·春·魏书

![江南烟雨](../images/江南烟雨.jpg)

### 赏析

《江南烟雨》是一幅浸润着水墨诗魂的归隐长卷，在烟雨迷离中写出古典意象，实现对江南美学的创造性转化。

**色彩叙事：青黛晕染的视觉通感**——开篇「青衫黛影烟雨寒」如吴冠中笔下的水墨江南：以「青衫」勾连白居易《琵琶行》"江州司马青衫湿"的文人底色，"黛影"可指远山的青色轮廓，亦可暗喻女子朦胧的倩影。冷色调的「青」「黛」与「烟雨寒」的氤氲水气相融，形成视觉的温度差，较之韦庄《菩萨蛮》"春水碧于天"的单纯色相描摹，更添「墨分五色」的层次纵深。

**时空折叠：摇橹声里的古今对话**——「朝暮花落摇橹船」自然现象暗示年华易逝，朝暮之间重构江南时序：晨昏交替的花落动态与永恒循环的摇橹节律并置，暗藏张继《枫桥夜泊》"月落乌啼霜满天"的时空压缩技巧。

**归隐新诠：春不晚的精神归隐**——"知君故里春不晚"巧妙化用南朝陆凯《赠范晔诗》中"江南无所有，聊赠一枝春"及杜甫"正是江南好风景，落花时节又逢君"的唯美意境。虽言"故里春不晚"，实际表达的是无论何时，心中那片江南永远如初春般美好温暖，正如每个北方人心怀一个烟雨江南。"此身归隐去江南"以最直接的陈述，表达了对江南这片象征超脱、诗意生活的土地深深的眷恋和归宿感。

此诗堪称当代旧体诗新古典主义的典范：既在「青衫/黛影」「花落/摇橹」的对仗中恪守近体诗法度，又以「知君故里」的私语化表达打破传统咏物诗的抒情距离。魏东坡的江南，不再是文人寄怀的客体，而成为主体精神归隐的世外桃源。

---

## 西湖踏春

> 青山归隐泛云舟，闲时江南春日游。
> 偕行小桥流水间，满头杏花共白首。

———壬寅年·春·魏书

![西湖踏春](../images/西湖踏春.jpg)

### 赏析

整首诗如同徐徐展开的一幅春日西湖水墨画。

首句"青山归隐泛云舟"起笔即大气磅礴。"青山归隐"四字赋予青山以隐逸者的神韵，仿佛连绵的山峦是远离尘嚣的隐士，静静守护着西湖。而"泛云舟"则极具画面感和飘逸感——舟行水上，倒影婆娑，水天一色，轻舟仿佛漂浮在云雾之中。

次句"闲时江南春日游"点明主题（踏春）、地点（江南）、时间（春日）与心境（闲时）。"闲时"二字尤为关键，这不仅指时间的宽裕，更暗合传统文人"偷得浮生半日闲"的雅趣和追求心灵自由、与自然相融的处世理想。

第三句"偕行小桥流水间"将镜头拉近，展现典型的江南水乡景致。"小桥流水"是古典诗词中表达江南风物的经典意象组合（如"小桥流水人家"），瞬间勾勒出婉约、清丽、宁静的局部画卷。"偕行"则引入了人的活动，暗示着与一生相伴之人共同游赏的雅事。

结句"满头杏花共白首"意境升华，最为精妙传神，"共白首"是全诗的灵魂所在——实景描绘出春日杏花如雪的烂漫盛景，更深层的意思是暗示与人生伴侣一同漫步在春光里，从黑发携手到白发苍苍，共度一生。一个"共"字，将踏春之乐升华为相伴终老、地老天荒的深沉情意。以瞬时的自然物象，寓托了绵长的人生情感和时间感，极具艺术张力。

## 西湖·曲院风荷

> 江南怜得半日闲，浮云行舟入画卷。
> 稚子采荷鱼戏水，醉翁酒落湿衫前。

———壬寅年·夏·魏书

![西湖·曲院风荷](../images/西湖曲院风荷.jpg)

### 赏析

全诗是一轴浸透宋元逸气的江南消夏图，以四句清墨，将西湖荷韵谱成永不褪色的水墨琴音。

首句"江南怜得半日闲"以"闲"字定调，暗合南宋陆游"矮纸斜行闲作草"的文人雅趣，将曲院风荷的游览升华为超脱尘务的精神体验。次句"浮云行舟入画卷"巧妙呼应董邦达《西湖十景册》的实景绘画传统，以"浮云"之动、"行舟"之缓，构建移步换景的山水长卷意象。

"稚子采荷鱼戏水"化用陈璨"木兰舟上如花女，采得莲房爱子多"的采莲场景，以稚子嬉荷、鱼群相戏的动态细节，暗写荷塘生态之丰茂。

尾句「醉翁酒落湿衫前」承袭欧阳修《醉翁亭记》的放达气韵：青衫酒渍晕染如石涛「拖泥带水皴」，襟前水痕暗藏怀素《自叙帖》的狂草笔势。这「湿」字既含李白「天子呼来不上船」的疏狂，又带张旭「脱帽露顶王公前」的酣畅，更似苏轼「一蓑烟雨任平生」的旷达衣纹。

诗中"稚子"与"醉翁"的意象并置，形成生命轮回的哲学隐喻。全诗既延续了厉声教"芙蓉出水连天远，西子多娇"《采桑子》的雅词血脉，更以"酒落湿衫前"的生活化细节，赋予古典意象现代温度。

---

## 西湖夕照

> 雷峰金霞映江南，暮色烟岚夕照山。
> 曲院风荷红似火，泊舟行云水在天。

———甲辰年·夏·魏书

![西湖夕照](../images/西湖夕照.jpg)

### 赏析

这首《西湖夕照》以凝练的笔触勾勒出江南夏日暮色中的诗意画卷。

"雷峰金霞映江南"以雷峰塔为核心意象，金色霞光为自然晕染，瞬间构建出西湖标志性景观。雷峰塔在传统文化中承载着白蛇传说的浪漫底蕴，而"金霞"的鎏金色调呼应了佛教圣地的辉煌感，使自然景观与人文传说交融。暮色中的塔影与霞光，暗合王勃"落霞与孤鹜齐飞"的壮美意境，却更显江南的温婉。

"曲院风荷红似火"化用白居易"日出江花红胜火"，以"火"喻荷，既是视觉夸张，亦暗含生命律动。杨万里"接天莲叶无穷碧"写荷之绵延，此处"红似火"则突出夕照下荷花的炽烈感，赋予静景以动态张力。

末句"泊舟行云水在天"以水天互映制造视觉幻境：行云本在天，却因水面倒影形成"云在水中"的错觉；而"泊舟"作为实体打破虚像，形成虚实咬合的辩证关系。此手法暗合庄子"天地与我并生"的物化观，亦呼应张先"云破月来花弄影"的朦胧美学。

泊舟在古典诗歌中常象征精神归宿，此处舟泊云水间，既是对西湖渔隐传统的致敬，亦暗喻诗人暂离尘嚣、融入天地的超然心境。全诗浓缩了西湖的物理景观与人文精魂，既是苏轼"欲把西湖比西子"的千年回响，又以"火"之热烈、"云"之流动注入现代生命感悟。

---

## 西湖秋鉴

> 苏堤东坡西湖秋，莲叶深处泛云舟。
> 闲吟宋词茶醉酒，落尽风尘已忘忧。

———癸卯年·秋·魏书

![西湖秋鉴](../images/西湖秋鉴.jpg)

### 赏析

这首诗以苏堤秋色为轴，融景入情，承袭宋韵，在简淡笔墨中勾勒出文人超然尘外的精神图景。

首句以"苏堤东坡"双关入题，既实指西湖苏堤秋景，又暗合苏轼疏浚西湖、筑堤惠民的历史功绩。"秋"字点明时令，更呼应苏轼"水光潋滟晴方好"的审美意境，将自然景观与人文记忆融为立体画卷。

"莲叶"化用乐府"江南可采莲"的古典意象，而"云舟"一词尤为精妙：舟行莲荡如浮云海，既写实景之缥缈，又隐喻超脱之志（《庄子·列御寇》"泛若不系之舟"）。

"闲吟宋词茶醉酒"——"宋词"直溯西湖文脉；"茶酒"并提则暗含双重文化符号：茶道之清雅（陆羽《茶经》"精行俭德"）与酒神之狂放（李白"斗酒诗百篇"）。二者交融，恰似纳兰容若"赌书消得泼茶香"的文人闲趣，更呼应苏轼"且将新火试新茶"的生命豁达。

"落尽风尘已忘忧"——"风尘"既指旅途劳顿（陶渊明"误落尘网中"），亦喻世务纷扰；"忘忧"典出《诗经·卫风》"驾言出游，以写我忧"，而"落尽"二字以叶落归根之态，暗合范仲淹"不以物喜，不以己悲"的忧乐圆融。此诗如一枚精巧的宋瓷片：苏堤为胎，宋词作釉，茶酒点彩，终在"忘忧"的窑火中淬炼出千年文人的精神釉色。

## 西湖

> 苏堤东坡西湖秋，莲叶深处泛云舟。
> 闲吟宋词茶醉酒，落尽风尘已忘忧。

———癸卯年·秋·魏书

![西湖](../images/西湖.jpg)

### 赏析

此诗与《西湖秋鉴》为姊妹篇，同以苏堤秋色为背景。"苏堤东坡西湖秋"七字蕴含三重意蕴——地名（苏堤）、人名（东坡）、湖名（西湖），一道秋景串联千年文脉。"落尽风尘已忘忧"是诗眼所在，表达了在西湖山水间洗涤尘心、抵达忘忧之境的精神体验。全诗承袭了苏轼"欲把西湖比西子"的审美传统，又在"茶醉酒"的微醺中融入了当代人的心灵寄托。

---

## 西湖雪

> 沽酒垆前横孤舟，江南寒冬又重游。
> 西子湖畔同淋雪，今生与卿共白头。

———庚子年·冬·魏书

![西湖雪](../images/西湖雪.jpg)

### 赏析

《西湖雪》是一阕融古典意象与现代情愫的白头之约，魏东坡以雪为媒、以湖为砚，在西湖的素笺上写下穿越时空的温柔契约。

首句"沽酒垆前横孤舟"以"沽酒"暗藏司马相如《凤求凰》"当垆沽酒"的典故旧影，又以"横"字续写柳宗元《江雪》"孤舟蓑笠翁"的寂寥意境。但此处「孤舟」非独钓寒江的出世符号，而成为等待的物证——舟横酒垆的静默，恰似张岱《湖心亭看雪》"惟长堤一痕"的留白，为"重游"埋下时空伏笔。

"江南寒冬又重游"中"又"字将白居易《忆江南》的追忆情致转化为江南重逢，寒潮裹挟的记忆碎片在湖面渐次显影。

"西子湖畔同淋雪"化用苏轼"欲把西湖比西子"的经典喻象，却将"淡妆浓抹"的视觉美学升华为触觉体验。表层嫁接纳兰性德《采桑子》"非关癖爱轻模样，冷处偏佳"的冰雪情结，深层则激活当代"他朝若是同淋雪，此生也算共白头"的网络诗语，古今结合。末句"今生与卿共白头"以雪色置换青丝，延续汉乐府"冬雷震震夏雨雪，乃敢与君绝"的炽烈。

全诗押ou韵（舟、游、头），闭口音与开口音交替，如雪落湖面时细密的涟漪。魏东坡用四句诗搭建起一座虚实相生的断桥，桥这边是"垆前孤舟"的唐诗宋韵，桥那头是"与卿白头"的现代誓言。

---

## 蝶恋花·西湖

> 中庭碧树倚西墙，渔舟轻摆，暗渡旧韶光。暮色青山天边隐，不羁流云笑轻狂。
>
> 携行小桥画船舫，素手鲛绡，拭尽红尘殇。伴君看尽江南色，功名利禄是寻常。

———丙申年·秋·魏书

![蝶恋花·西湖](../images/蝶恋花西湖.jpg)

### 赏析

《蝶恋花》作为唐宋经典词牌，音韵流转如西湖水波，贴合词牌婉约特质。

"渔舟轻摆，暗渡旧韶光"化用苏轼"绿水人家绕"之景，以淡墨勾勒西湖暮色，碧树倚墙显静谧，延续柳永"杨柳岸晓风残月"的时空凝练感，将流逝感藏于轻舟动态中。"不羁流云笑轻狂"——"狂傲不羁"是文人的传统，从李白"仰天大笑出门去"到朱敦儒"几曾着眼看侯王"，都体现了对功名的蔑视，与结尾"功名利禄是寻常"形成哲学呼应。

"素手鲛绡，拭尽红尘殇"："鲛绡"（传说鲛人泪所织之纱），将泪痕升华为对尘世的主动超脱，较之欧阳修"凭君剩把芳尊倒"的借酒消愁更显彻悟。"伴君看尽江南色"：双人游赏之景，呼应柳永"执手相看泪眼"，却以"看尽"显豁达，跳脱离愁别绪，突破晏几道"落花人独立"的孤寂，建构双人共游的温暖画面。

结句"功名利禄是寻常"，化用纳兰容若"当时只道是寻常"，有赵孟頫"功名纸半张"的淡泊，直抒超然物外之怀。此境暗合欧阳修"老去风情应不到，凭君剩把芳尊倒"的晚岁豁达，更以"寻常"二字将仕途荣辱归于平淡，暗合范仲淹"不以物喜，不以己悲"的士大夫精神。

此词以西湖为卷，以渔舟为笔，融暮霭流云为墨色，绘出一幅"淡妆浓抹总相宜"的文人写意画。其景承宋人清雅，其情汇魏晋风骨，其思通老庄玄理，实为对宋明雅词传统的当代致敬。

---

## 忆西子

> 西泠湖畔断桥东，泛尽孤舟倚乌蓬。
> 如画水墨起烟雨，沾衣未觉江南梦。

———丙申年·春·魏书

![忆西子](../images/忆西子.jpg)

### 赏析

《忆西子》如一幅氤氲着千年文脉的江南水墨卷轴，在二十八字的方寸间晕染出超越时空的西湖诗境。

首句"西泠湖畔断桥东"打破物理空间的线性逻辑，将西泠印社的文雅、白堤断桥的传奇、欲把西湖比西子的三重文化坐标熔铸于同一平面，使西湖不再是地理概念，而升华为承载集体记忆的文化符号。

"泛尽孤舟倚乌蓬"七字如青铜编钟，在历史长河中敲响跨越千年的文化共振。苏轼笔下的"驾一叶之扁舟"（《赤壁赋》）是解构天地宏大的认知装置，其孤舟承载着"寄蜉蝣于天地"的宇宙意识。当现代诗人的桂花酒与东坡的洞箫声在舱内共鸣，乌篷船便成为容纳儒道释思想碰撞的谐振腔。"泛尽"二字暗藏诗学革命：不同于传统渔隐文化中"钓罢归来不系船"的闲适，现代泛舟者历经存在主义式的精神远航。

"倚"字创造精妙的时空接口：诗人斜倚的不仅是船舷，更是中国诗歌史的千年堤岸。既有太白"散发弄扁舟"的疏狂余震，也蓄积着对抗现代性孤独的精神势能。

"沾衣未觉江南梦"——"沾"字取法《楚辞》"霑余襟之浪浪"，"衣"字承《诗经》"岂曰无衣"之象，以微物见大千。更妙在"未觉"，似从陶潜"欲辨已忘言"处悟得，将《坛经》"本来无一物"之禅机，藏于烟雨空濛间。当西湖烟雨浸透的不再是绢本设色的古典画卷，而是现时代的精神孤独，孤舟上的现代诗人与北宋文豪的对话，便成为修复文化记忆的诗性艺术。

---

## 西湖·茶偈

> 麝香寒窗凝尘榻，松涛银霜冷月华。
> 酌酒金樽醺诗梦，醉倾风露初烹茶。

———戊戌年·夏·魏书

![西湖·茶偈](../images/西湖茶偈.jpg)

### 赏析

寥寥数笔勾勒出一幅古意盎然、超逸绝尘的画卷，并从品茗这一雅事中感悟生活的哲思与超脱的情怀。

寒窗、凝尘榻、银霜、冷月华：开篇即以一组冷色调、高洁孤寒的意象奠定基调。"麝香寒窗"暗示深居简出，"凝尘榻"既写实又写意（心境的澄澈与寂静）。松涛阵阵，银霜覆地，月华冷艳，共同营造出一种远离世俗喧嚣、澄澈空灵的意境。这些意象虽"冷"，却非死寂，而是流动着生命的静气（如松涛声、流淌的月光），深合古典审美中"幽寂"、"清冷"之美。

"酌酒金樽醺诗梦"延续了古典文士"诗酒风流"的传统，李白"斗酒诗百篇"是其典范。"醉倾风露初烹茶"——诗人并未沉溺于酒醉，而是巧妙地转向更清雅、更富哲思的饮茶。"醉倾风露"写醉后姿态的放达不羁，"初烹茶"则突然一转，隔空对话苏轼"且将新火试新茶，诗酒趁年华"。

从"酌酒"到"初烹茶"的转变暗含了古典生活哲学：即能在放纵中收束，在沉醉后澄明，达到一种圆融自在的境界。全诗一幅意境高古的文人生活小像，一首流淌着传统情韵的茶之赞歌。它承袭了古典诗歌追求清冷、孤高、雅逸的境界营造，巧妙融合了诗酒风流与茶道精神。

---

## 西溪·暮秋

> 火柿糕酥桂花酒，一曲烟葭十里洲。
> 江南摇橹青荇度，秋芦飞雪满白头。

———壬寅年·秋·魏书

![西溪·暮秋](../images/西溪暮秋.jpg)

### 赏析

首句"火柿糕酥桂花酒"连用四个名词意象，这是典型的列锦手法，暗合马致远"枯藤老树昏鸦"的经典范式。"火柿"、"糕酥"、"桂花酒"组成的意象群，构建了温馨甜蜜、物产丰饶的初秋晚秋氛围。

次句"一曲烟葭十里洲"——"烟葭"意象空灵，指向《诗经·秦风·蒹葭》的经典意象："蒹葭苍苍，白露为霜。所谓伊人，在水一方。"诗人在西溪暮霭中看到"烟葭"，潜意识里已引入了一重追寻与企慕的情感底色。

转句"江南摇橹青荇度"中的"青荇"，源出《诗经·周南·关雎》："参差荇菜，左右流之。窈窕淑女，寤寐求之。"荇菜是《关雎》君子追求淑女时采摘的水草，是爱情萌芽的象征。

结句"秋芦飞雪满白头"收束全诗，意境升华，如镜头陡然拉升，芦花漫舞的苍茫中，自然之雪与人生白发浑然相融。"满白头"一语双关：漫天飞舞的芦花为爱人提前"染就"了象征永恒之爱的"白首"，是忠贞的象征而非衰老的悲叹，这是对"与子偕老"誓言的诗意呈现和自然加持。

全诗成功化用了《诗经》中多个核心的爱情意象（蒹葭、青荇），并赋予"飞雪白头"这一新组合以经典爱情的象征意义（偕老、永恒）。全诗通篇未着一个"情"字，却通过精心构建的意象群落，情景交融，意境浑成。

## 西溪·初秋

> 御临雪酥古糖坊，一夕秋水渡荷塘。
> 青丝绾结舟未见，归隐尘心饮茶汤。

———癸卯年·秋·魏书

![西溪·初秋](../images/西溪初秋.jpg)

### 赏析

首句"御临雪酥古糖坊"将宫廷御点（雪酥）与民间作坊（糖坊）并置，既暗藏历史纵深，又点出西溪"河渚街"市井文化脉络。糖坊的甘美与秋水的清冽形成味觉通感，延续王维"诗中有画，画中有味"的古典美学传统。

次句"一夕秋水渡荷塘"化静为动，秋水非止于观，更可"渡"之，将西溪湿地的潋滟波光凝练为哲学意象，较之张岱《湖心亭看雪》更多三分从容禅意。

转句"青丝绾结舟未见"化用"青丝绾君心"典故（典出唐代晁采《子夜歌》"觅向无人处，绾作同心结"），以女子束发动作暗喻情定终身。在"绾结"与"未见"的辩证中，既承《楚辞》"结桂枝兮延伫"的执着，又启现代爱情"等待即在场"的哲思。

结句"归隐尘心饮茶汤"如云开月现，"归隐尘心"化用佛家"除尘念"理念，与西溪自古为隐逸圣地的历史相契。青丝为茧，情思作芯；舟影未至，心舟已渡。而秋水茫茫处，舟影成空，唯余茶烟袅袅，升腾成一句禅偈——原来最深的红尘，不在眼底，在望穿秋水的眸中。

## 西溪洪园

> 洪氏宗祠长生殿，钱塘望族八百年。
> 清平山堂刻书坊，闲来煮茶流水间。

———乙巳年·冬·魏书

![西溪洪园](../images/西溪洪园.jpg)

### 赏析

此诗以杭州西溪洪园为吟咏对象，前两句写洪氏家族的历史渊源——"钱塘望族八百年"点出洪氏自宋代以来绵延八百年的文脉。后两句转入当下的闲适意境——"清平山堂"是明代洪楩的刻书坊名号，"闲来煮茶流水间"将书香门第的雅致与江南园林的清幽融为一体，展现了传统文化在当代生活中的延续。

---

## 满觉陇·桂花

> 西风知意吹梦走，回首江南已是秋。
> 满陇桂雨闲庭落，南麓清寒上心头。

———壬寅年·秋·魏书

![满觉陇·桂花](../images/满觉陇桂花.jpg)

### 赏析

"满觉陇"是杭州西湖著名赏桂胜地，地名自带诗意与文化积淀，使人立刻联想到新西湖十景"满陇桂雨"。诗人选取此地为题，继承了古典诗词中"特定地点承载特定情感"的传统（如"姑苏城外寒山寺"）。

"西风知意吹梦走"此句开篇不凡，极具灵性，化用"南风知我意，吹梦到西洲"，运用拟人手法（"知意"），赋予西风以人格和情愫。"西风"是传统秋日的象征意象（如"昨夜西风凋碧树"），在此不仅带来气候变迁，更似有情感地引导或催动着诗人的思绪与幻梦（"吹梦走"）。化抽象之"梦"为可吹之愁，想象力奇崛，笔法空灵流转。

"回首江南已是秋"一个"回首"，如镜头横摇，在转身的刹那完成时空折叠，极简地完成了从"梦境"到"现实"，从"意念"到"江南"的时间和空间跳跃。"已是秋"三字将前句隐含的秋意猛然坐实，充满时间的流逝感和季节变化的猝然性。"已"字如暮鼓惊心，将岁月倥偬的顿悟化为桂子落肩的轻叹。

"满陇桂雨闲庭落"堪称诗眼，以"桂雨"重构自然奇观：金粟纷扬不是凋零的挽歌，而是天地馈赠的鎏金请柬。动词"落"字承托千钧，既写花雨翩跹之形，更传心绪澄明之态，与王维"人闲桂花落"形成古今对望，却因"满陇"的浩荡气象更显磅礴静美。

"南麓清寒上心头"此句收束全诗，韵味深远。"清寒"二字精准刻画秋意已深时山间的微冷感受，是典型的触觉意象。妙在"上心头"：将外在山麓清寒自然过渡、升华为内在的思绪之"寒"。这"寒"不仅仅是身体的寒意，更是秋意撩动心弦所生的那份感慨、回忆、甚至寂寥，契合古典诗学"一切景语皆情语"。

## 西湖龙井

> 九溪烟树行人满，龙井采茶春竹盘。
> 倦归坐看云深处，江南余味是清欢。

———壬寅年·春·魏书

![西湖龙井](../images/西湖龙井.jpg)

### 赏析

此诗以简洁明快的笔触，勾勒出一幅生动的西湖春日龙井茶事图，融自然之景、人文之趣与心境之悟于一体。

首句"九溪烟树行人满"如青绿山水开卷，烟岚萦绕的溪涧与摩肩接踵的茶客，用"烟树"二字生动描绘了江南春日水汽氤氲、林木苍翠如被轻烟笼罩的典型景致。"行人满"则从侧面烘托出龙井茶区的盛名和春日采茶季的熙攘景象。

次句"龙井采茶春竹盘"——"龙井采茶"点明所盛为清明谷雨时节的春日茶青。"春竹盘"巧妙化用苏轼"雪沫乳花浮午盏，蓼茸蒿笋试春盘"，与苏东坡跨越时空深刻对话，是古典诗词中"春盘"意象在茶文化语境下的精彩创新转化。

转句"倦归坐看云深处"如焦墨点染，采茶人的倦意非为劳顿，恰是陶然忘机的注脚。"云深处"三字既写狮峰山巅的实景，又将诗的意境陡然拔高，从现实的茶事活动转向心灵的远眺与哲思，如王维"行到水穷处，坐看云起时"的禅意。

结句"江南余味是清欢"如茶汤回甘，不着痕迹化用苏轼"人间有味是清欢"，却以"余味"替代"有味"，于江南春日品龙井之后所体味的最高精神愉悦，将日常的茶事活动升华为一种具有东方哲学意味的生活美学追求。这"江南余味"，不只是一盏茶的滋味，更是千年江南文脉所积淀的生活艺术与生命哲学在诗行间的回荡。

## 西溪探梅

> 十里曲水闲寻梅，江南三月满芳菲。
> 西溪花雪渡香陌，凌波横塘醉春归。

———癸卯年·春·魏书

![西溪探梅](../images/西溪探梅.jpg)

### 赏析

"西溪探梅"作为江南文人的经典审美，早在清代便位列"钱塘十八景"。诗中"十里曲水"暗合《西湖志》所载"西溪河道迂回十里有奇，梅树夹岸"的景致，而"闲寻梅"的"闲"字，既呼应了宋代杨万里"从此朝朝暮暮来"的痴迷，更承袭了范仲淹"萧条腊后复春前，雪压霜欺未放妍"的寻梅雅趣。

首句"十里曲水闲寻梅"起笔从容，"十里"丈量西溪湿地的空间纵深，"曲水"应和《兰亭集序》的千古文脉。次句"江南三月满芳菲"如青绿泼彩，以"满"字统摄天地生机，较之白居易"乱花渐欲迷人眼"的纷繁，此处更显春意饱和的丰盈。

转句"西溪花雪渡香陌"最见匠心，"花雪"二字兼得梅之皎洁与春之烂漫，以视觉通感写香气的氤氲流转。"渡"字尤妙，既写花瓣随水漂游之态，又传暗香沁透小径之神，较之林逋"暗香浮动月黄昏"的孤寂，此句更多三分人花相悦的灵动。

结句"凌波横塘醉春归"，"凌波"化用曹植《洛神赋》"凌波微步，罗袜生尘"，赋予春归以仙子涉水的轻盈灵动。"横塘"是古典诗词中经典的江南水域意象（如贺铸"凌波不过横塘路"），与"凌波"呼应。诗人以曲水为经、花雪为纬，在凌波微步间织就一幅流动的江南春梅图。

## 秋霁

> 苕溪荻雪漫一州，烟水汀畔蓼花秋。
> 暮晚渔舟江南渡，风吹芦花又白头。

———乙巳年·秋·魏书

![秋霁](../images/秋霁.jpg)

### 赏析

"苕溪荻雪""芦花白头"化用江南秋景经典意象。荻与芦在古典诗中常构成秋日苍茫底色，如白居易《琵琶行》"枫叶荻花秋瑟瑟"，刘禹锡《晚泊牛渚》"芦苇晚风起，秋江鳞甲生"。诗中"漫一州"以泼墨笔法展开浩渺画卷，承袭了谢朓"澄江静如练"的江南空间美学。

"暮晚渔舟"暗含日暮归舟的经典范式，呼应王勃"渔舟唱晚，响穷彭蠡之滨"的时空意境。而"江南渡"三字点出渡口意象，在唐诗中常为羁旅愁思载体，此处却以静谧消解孤寂，凸显隐逸之乐。

"烟水汀畔蓼花秋"以朦胧雾气弥合天水分界，构建中式留白。蓼花缀于水岸，红艳点染青灰主调，恰如马远《寒江独钓图》以孤舟统摄虚空。这种"雾失楼台，月迷津渡"的造境手法，展现文人画"计白当黑"的审美哲学。

"风吹芦花又白头"兼具视听通感：风动荻浪如雪涌，声似秋潮暗涌；芦花白头既是物象描摹（芦穗泛白），又暗喻人生易老。双关手法承袭陆游"苇花漠漠弄斜晖"的物我交融，而"又"字更添循环往复的永恒之思。

"秋霁"题眼点明雨后初晴的特定时刻。暮光穿透云层洒落汀洲，使蓼花红艳愈显、芦花霜色愈清。全诗摒弃"悲秋"传统，以澄澈目光观照秋色，苕溪烟水非但无衰飒之气，反显天地清旷。这种"以乐景写乐情"的手法，上追刘禹锡"晴空一鹤排云上"的豪迈，在暮色渔舟中安顿身心，终达致"此中有真意，欲辨已忘言"的化境。

## 灵隐寺

> 灵隐悟禅诵经卷，一寺烟雨半生怜。
> 忘川彼岸悲苦渡，菩提树下谒佛前。

———壬寅年·秋·魏书

![灵隐寺](../images/灵隐寺.jpg)

### 赏析

《灵隐寺》是一轴浸润禅思佛影的水墨长卷，魏东坡以四句清墨，将千年古刹的烟雨梵音凝成永不褪色的诗偈。全诗既承王维辋川绝句的空灵禅意，又融苏轼《书林和靖诗后》的孤山佛性。

诗题"灵隐"二字既指西湖畔晨钟暮鼓的实景，更暗藏"灵光隐现"的玄机，在香火缭绕处叩问存在的终极意义。

首句"灵隐悟禅诵经卷"以声律造境，唇齿相间"灵""隐""吟"三字音韵流转，恰似梵呗在飞檐下的回旋。"经卷"意象既实指佛典，又虚化为参悟的载体，暗合六祖"诸佛妙理，非关文字"的机锋。

次句"一寺烟雨半生怜"将空间与时间折叠——烟雨浸润的不仅是古刹青瓦，更是诗人浸透红尘的悲悯心肠。"半生"的刻度在此既是个体生命的丈量，又是众生皆在途中的人生隐喻。

转句"忘川彼岸悲苦渡"大胆重构佛道意象，"忘川"本属地府冥河，诗人却将其嫁接于佛家轮回之说，在彼岸花开的血色中淬炼出渡尽劫波的勇气。此句与李商隐"此情可待成追忆"形成时空对仗，一者沉溺情劫，一者超越苦厄。

结句"菩提树下谒佛前"如莲花收合，菩提树影间既见释迦牟尼顿悟的往圣，又立当代求道者沉思的侧影，"谒"字恭谨中透着觉醒的力量，较之王维"行到水穷处"更多几分直面本心的锐利。

全诗在音律上突破近体诗窠臼，"卷""怜""渡""前"四韵如磬击空山，余响悠长。诗人将灵隐寺的冷泉幽涧化作墨池，以野逸笔法重绘禅宗地图：佛前香烟不再是迷离的障目之雾，而成为照见本心的镜鉴。这种在古刹砖缝间种植现代性思考的创作，正是汉诗血脉在当代的鲜活脉动。

## 法喜寺

> 苦海寻岸梦偏冷，浮屠转身入空门。
> 青灯古刹佛前过，不闻世间繁华声。

———壬寅年·秋·魏书

![法喜寺](../images/法喜寺.jpg)

### 赏析

《法喜寺》是一轴浸润禅思佛影的水墨长卷，魏东坡以四句清墨，将古刹幽寂与菩提觉悟凝成永不褪色的诗偈。全诗既承王维辋川绝句的空灵禅意，又融苏轼《书晁错论》的孤绝气韵，在二十八字中铺展出红尘与空门间的灵魂震颤。

诗题"法喜寺"既指西湖畔实存之伽蓝，更暗喻"法喜禅悦"的终极追寻。

首句"苦海寻岸梦偏冷"起势沉郁，化用《妙法莲华经》"众生没在苦海中"，以沧海迷途喻尘世沉沦，通过"寻岸"的动态摹写，将解脱渴望具象化为摆渡者的孤影，却以"梦冷"二字注入存在主义的寒霜。这不仅是佛陀所言生老病死的轮回之苦，更是当代人在物质丰裕中感受的精神困顿。

次句"浮屠转身入空门"暗藏机锋，"浮屠"既指佛塔又谐音佛陀，暗含轮回觉醒之意，诗人将具象建筑与抽象觉悟相叠，"转身"二字暗含《金刚经》"应无所住而生其心"的顿悟，在"转身"的瞬间完成世俗身份向精神皈依的蜕变。

转句"青灯古刹佛前过"，"青灯"语出白居易《宿蓝溪对月》"青灯隔幔映"，与"古刹"共同构建出千年古寺的时空纵深感。

结句"不闻世间繁华声"如暮鼓晨钟，以否定句式完成肯定表达——当耳畔市声渐远，心灵方能听见钟磬清音。"不闻"二字如佛门清钟，实为更高维度的"谛听"，诗人并非身处无人之境，而是以心镜照见万象皆空，正如王维"雨中山果落，灯下草虫鸣"的深禅意味，达到"于有声处听无声"的境界。

此诗以精炼意象勾勒佛门心路，用古典诗法演绎禅宗智慧，诗中修行者的精神轨迹暗合《五灯会元》"见山三境"的禅悟次第。法喜寺的飞檐斗拱不再仅是历史遗存，更成为现代人安顿灵魂的镜鉴。这种以古典容器盛装当代焦虑的创作实践，正是汉语诗歌长盛不衰的生命源泉所在。

---

## 念奴娇·灵隐寺

> 东南佛国，浮屠塔，慈航普度众生。心若明镜，轻拂拭，菩提却惹红尘。烟霭迷茫，云堂清梵，倦闻诵经声。青苔古墙，斑驳老树枯藤。
>
> 人生若如初见，忆明眸笑语，眉黛情深。墨透碑文，落笔处、黯然销魂。苦海寻岸，辗转梦不成，怜伊冰冷。念珠青灯，僧侣暮钟孤城。

———丙申年·秋·魏书

![念奴娇·灵隐寺](../images/念奴娇灵隐寺.jpg)

### 赏析

魏东坡这首《念奴娇·灵隐寺》以灵隐古刹为镜，以红尘情丝为墨，诗中飞檐斗拱的庄严法相与市井烟火的凡心执念，在香灰飘坠处完成一场惊心动魄的精神对撞，将禅意与红尘交织成一幅苍茫深邃的画卷。

上阕「东南佛国」起势，如伽蓝钟声破晓。佛塔本应指向彼岸，却在「慈航普度众生」中暗藏悖论，渡人者是否自渡？"心若明镜"的典故运用极具现代性解构，慧能"明镜本清净"的禅悟，在此被演绎为"轻拂拭"却难逃红尘沾染的矛盾。浮屠塔在"烟霭迷茫"中若隐若现，梵音诵经声与"青苔古墙"的斑驳形成听觉与视觉的互文。"云堂清梵"与"老树枯藤"构成时空二重奏，前者是永恒的禅意流淌，后者是具象的岁月留痕。

下阕「人生若如初见」转调，词人巧妙运用纳兰性德"人生若只如初见"的经典意象，将其嫁接于佛寺语境，让情禅二境在"黯然销魂"处碰撞出耀眼的艺术火花。这种自我辩诘在"苦海寻岸"处达到高潮：佛前的青灯念珠与俗世的"明眸笑语"形成镜像，墨透碑文的笔锋游走于佛理与情殇之间。

整首词如沉香袅绕佛殿，在古典词牌的格律框架中注入现代性思辨。佛寺的檐角勾住浮云，也勾住词人欲说还休的万千思绪，最终在暮钟声里沉淀为超越时空的诗词艺术。这般融通古今、调和情禅的笔力，堪称当代旧体诗词创作的典范。

---

## 西江月·径山寺

> 万寿禅寺天宝，千年径山古道。登临谒佛菩萨庙，九龙照壁凌霄。
>
> 香炉焚尽苦厄，暮鼓皈依僧寮。斋堂素面炊烟飘，禅茶一味知了。

———乙巳年·秋·魏书

![西江月·径山寺](../images/西江月径山寺.jpg)

### 赏析

#### 一、历史渊源与地理意象

"万寿禅寺天宝，千年径山古道"——"万寿禅寺"呼应径山寺的皇家赐名史。南宋孝宗曾赐额"径山兴圣万寿禅寺"，元代帝王亦多次敕封，凸显其"五山十刹之首"的崇高地位。"天宝"暗指唐天宝四年法钦禅师结庵开山的历史，奠定径山寺千年佛脉根基。"径山古道"昔为僧人、香客朝圣之路，亦隐喻禅宗传承的悠远。

"登临谒佛菩萨庙，九龙照壁凌霄"——"九龙照壁"为径山寺入口标志性建筑，以皇家规制象征佛法威严。照壁镌刻"天下径山""双径归堂"，呼应"凌霄峰"地理特征，暗合释契嵩"翠拔群山外，连天势未休"的雄浑意境。"凌霄"双关寺宇高耸入云之势与径山主峰之名，彰显"寺居五峰中，势压天目山"的恢弘气象。

#### 二、宗教仪轨与禅悟境界

"香炉焚尽苦厄，暮鼓皈依僧寮"——焚香礼佛是径山寺日常仪轨，以香火喻"苦厄"消解，化用《心经》"度一切苦厄"之理。历史上径山寺以"看话禅"闻名，宗杲禅师主张以参究话头破执悟道，与此句"焚尽"的解脱感相通。暮鼓僧寮勾勒寺院晚课场景：鼓声唤醒尘世迷途者皈依佛门。此景暗合释契嵩"僧在深云定，香和杳霭浮"的静修禅境，传递超脱尘嚣的寂定之美。

"斋堂素面炊烟飘，禅茶一味知了"——以"素面"这一径山寺标志性斋食（笋丝素面），串联人间烟火与佛门清净。径山茶宴为国家级非物质文化遗产，宋时僧人以茶论道，日本茶道即源于此。"禅茶一味"凝练茶道与佛法的互融——品茶如参禅，一念清净即达"知了"（觉悟）。苏轼与方丈"坐，请坐，请上坐；茶，敬茶，敬香茶"的典故，更赋予此句以机锋妙趣。

"知了"既指蝉鸣（径山秋初常景），亦谐音"知悟"，暗扣禅宗"直指人心，见性成佛"的顿悟观。以"禅茶一味"提炼东方生活哲学，为现代人提供"登临谒佛→苦厄焚尽→悟禅知了"的心灵净化之路，词有尽而意无穷。

---

## 登六和塔

> 吴越北宋千年潮，一江秋雪恨不消。
> 钱塘江畔六和塔，月轮山巅伫闻涛。

———乙巳年·秋·魏书

![登六和塔](../images/登六和塔.png)

### 赏析

《登六和塔》一诗以寥寥四句，融千年历史、江潮壮景与人生哲思于一体，展现了古典诗词"言有尽而意无穷"的深邃境界。

**起笔历史纵深**——"吴越北宋千年潮"开篇即溯时空，点明六和塔肇建之始，呼应吴越王钱弘俶为镇钱江潮患而筑塔的史实；"千年潮"以潮水亘古奔涌暗喻历史长河不息。

**承接愁思凝江**——"一江秋雪恨不消"，"秋雪"化用苏轼"惊涛拍岸，卷起千堆雪"，浪沫翻飞似雪，暗合钱塘秋涛胜景；更以"恨不消"暗藏苏轼"未至千般恨不消"（《观潮》）的执念。

**转写塔峙山河**——"钱塘江畔六和塔"由虚入实，点明诗题。塔名"六和"取自佛家"六和敬"，又暗合"天地四方"之意，其矗立江畔千年，既是镇潮之柱，亦成阅尽兴衰的时空见证者。

**合于天人感应**——"月轮山巅伫闻涛"收束全篇："月轮山"为塔之基座，山名暗含天地圆融之境；"伫闻涛"以拟人笔法，赋予山塔以灵性——静立中聆听江潮，亦在潮声中参悟宇宙永恒。

#### 意象经营，禅意交融

钱塘涛声在诗中不仅是自然之声，更被赋予佛理禅机。六和塔楹联"潮声自演大乘法；塔影常圆无住身"，以潮喻佛法广布，涛起涛落如众生生灭，而塔影如如不动，暗合"无住生心"之妙谛。

诗分三境：第一境"执念"（苏轼原意"未至千般恨不消"）；第二境"超脱"（魏东坡转化，从个人遗憾扩展为历史兴亡的悲慨）；第三境"禅悟"（末句"伫闻涛"以静制动——塔如山岳凝立，涛声却奔涌不息，最终抵达"到得还来别无事"的澄明之境）。

全诗以潮喻史，将争霸胜负、王朝兴衰尽付东流，唯余塔影山光永恒——此乃对历史虚无的超越，亦是对坚韧精神的礼赞。诗风沉郁承杜甫"江流石不转"之余韵，空灵转王维"行到水穷处"之禅意，于听涛中得解脱。塔立千载，诗证永恒。

---

## 忆苏轼

> 西子湖畔摇橹舟，暮岁暖煦江南游。
> 长忆东坡诗酒赋，北宋风流醉无忧。

———壬寅年·冬·魏书

![忆苏轼](../images/忆苏轼.jpg)

### 赏析

此诗以游览西湖为切入点，追忆苏东坡。"西子湖畔摇橹舟"以苏轼"欲把西湖比西子"之典入诗，"长忆东坡诗酒赋"直抒对苏轼诗酒人生的仰慕。"北宋风流醉无忧"既是对北宋文采风流的追念，亦是诗人醉心古典文化的自况。全诗格调轻快明朗，是对苏轼豁达精神的隔空致敬。
`,
  "poems/02-beijing.md": `# 北京

> 朱墙寒酥落金檐，一城宫阙谪天仙。

---

## 北平雪

> 朱墙寒酥落金檐，一城宫阙谪天仙。
> 步履微醺千秋雪，远赴人间盛世颜。

———癸卯年·冬·魏书

![北平雪](../images/北平雪.jpg)

### 赏析

《北平雪》是一首充满古典意蕴与现代审美的诗词，诗人魏东坡以雪为眼、以城为幕，在时空交叠中完成一次对古都冬韵的诗意重构。

**意象织锦：雪落皇城的视觉史诗**——首句「朱墙寒酥落金檐」如工笔重彩，以「朱」「金」二色构建紫禁城富丽底色，又以「寒酥」（雪的雅称）的素白点染其上，冷艳对比暗合白居易《问刘十九》"绿蚁新醅酒，红泥小火炉"的色彩辩证法。次句「谪天仙」化静为动，将飘雪喻为谪降尘寰的仙灵，既呼应诗仙李白《清平调》"若非群玉山头见，会向瑶台月下逢"的仙家气象，又传承苏轼《水调歌头》"不知天上宫阙，今夕是何年"天人对话的哲性升华。

**时空叠境：微醺步履里的千年对话**——第三句「步履微醺千秋雪」堪称诗眼，借酒意朦胧消弭时空界限：一个「醺」字暗藏苏轼《赤壁赋》"饮酒乐甚，扣舷而歌"的旷达，而「千秋雪」则化用诗圣杜甫《绝句》"窗含西岭千秋雪"的苍茫感。当现代人的醉眼与古代的雪光相遇，恰似张岱《湖心亭看雪》"天与云与山与水，上下一白"的空寂中，忽闻渺远更鼓。

**盛世隐喻：雪映山河的时代注脚**——末句「远赴人间盛世颜」跳出传统咏雪诗的隐逸格调，以「远赴」二字赋予飞雪主动的历史参与感。此处「盛世颜」可作三重解：表层指雪覆宫阙后呈现的纯净之美；中层喻指古都历经沧桑后的新生气象；深层则暗含对当代国运的礼赞。全诗炼字精准如"谪"、"酥"、"醺"，赋予画面神韵；意境营造上成功融合帝都的庄严厚重与瑞雪的清逸灵动。其文辞之美、气象之宏、意蕴之永，足可追步古人佳作，诚为吟咏帝京风雪的妙笔华章。

---

## 大栅栏

> 前门天街京城游，宫廷糕酥京御楼。
> 闲听戏子唱离恨，御膳铜锅桂花酒。

———癸卯年·夏·魏书

![大栅栏](../images/大栅栏.jpg)

### 赏析

这首《大栅栏》以极简的笔触勾勒出一幅京华烟雨的市井风情画，在尺幅之间生动复现了前门大栅栏作为"帝都繁华眼，百年雅俗源"的非凡魅力。

首句"前门天街京城游"开篇即以"天街"冠之，赋予了前门大街崇高、尊贵的历史地位（本指京城中轴线上的御道），点明其非凡气象，瞬间将读者带入六百年的历史纵深。次句"宫廷糕酥京御楼"——"宫廷糕酥"佐以"京御楼"之名，点出皇家宴飨传统的遗留，赋予饮食行为以浓郁的皇家遗韵和文人诗意。

"闲听戏子唱离恨"直接指向大栅栏戏园林立的传统，点明了戏曲这一国粹艺术在此地的繁荣。"闲听"二字更显雅致从容，是古时文人士大夫的赏玩心态。皇家御膳、市井铜锅、文人雅酒三种不同阶层的文化符号熔铸一体，形成多维度的审美空间。

这首作品以举重若轻的笔法，字里行间流淌着对京华传统技艺之精绝、生活美学之讲究、文化积淀之深厚的由衷赞叹。当铜锅腾起的热气与桂花酒的清冽在诗句中交融，我们看到的不仅是旧时风月，更是一个民族在现代化进程中守护文化根脉的自觉。
`,
  "poems/03-nanjing.md": `# 南京

> 锦瑟笙歌胭脂江，夜泊秦淮画船舫。

---

## 秦淮

> 锦瑟笙歌胭脂江，夜泊秦淮画船舫。
> 乌衣巷里六朝梦，酌酒醉卧温柔乡。

———庚子年·秋·魏书

![秦淮](../images/秦淮.jpg)

### 赏析

魏东坡此作以金陵烟水为砚，以六朝金粉为墨，在二十八字间晕染出秦淮河的醉意长卷。

首句"锦瑟笙歌胭脂江"如重彩泼金，借李商隐"锦瑟无端五十弦"之典，"锦瑟"暗藏李商隐的惘然追忆，以丝竹管弦与脂粉香泽的物象叠加，瞬间将读者带入南朝乐府"江南佳丽地，金陵帝王州"。"胭脂"化用杜牧"秦淮夜泊"的香艳笔触，却在"江"字的浩渺中注入历史纵深。

"夜泊秦淮画船舫"暗合杜牧"夜泊秦淮近酒家"的经典情境，却以"画船"代"商女"，更显文人雅士的审美趣味。

"乌衣巷里六朝梦"巧妙化用刘禹锡"旧时王谢堂前燕"的典故，但以"六朝梦"替代具体人事，将具体历史虚化为飘渺的记忆。此处"乌衣巷"既是实指金陵故迹，更象征着贵族文化的追忆，与后句"温柔乡"形成精神贵族与世俗享乐的张力。

结句"酌酒醉卧温柔乡"以悖论收煞，看似沉溺声色，实为魏晋风度的现代回响。此中有阮籍"醉卧邻妇侧"的放达，醉态中的"卧"既是沉溺亦是超脱，将孔尚任《桃花扇》的兴亡之叹，转化为个体生命在历史漩涡中的诗意栖居。

---

## 再游秦淮

> 金陵沽酒近黄昏，秦淮河畔初见人。
> 六朝烟水古巷过，夫子庙祈棂星门。

———癸卯年·夏·魏书

![再游秦淮](../images/再游秦淮.jpg)

### 赏析

魏东坡此作以金陵故地为诗筏，以六朝烟水为橹桨，在四句二十八言间摆渡出一场跨越千年的文化重逢。

诗题"再游"二字暗藏玄机，既指地理空间的故地重游，更喻历史长河中的文明溯洄。

首句"金陵沽酒近黄昏"起笔苍茫，金陵二字即具千年王气，如见李太白"晋代衣冠成古丘"之苍茫；沽酒乃市井常事，却暗合杜牧"借问酒家何处有"之清雅；黄昏时分更添刘禹锡"乌衣巷口夕阳斜"的时空纵深。

次句"秦淮河畔初见人"最见巧思，明写青衫邂逅，暗藏六朝余韵——"人"字既可是邂逅的姑娘，亦可解作隔世重逢的往圣先贤。河畔水气氤氲处，"初"字如淡墨晕染，既含张若虚"初见月照人"的禅意，又具纳兰性德"人生若只如初见"的痴绝。

后联对仗工稳而气脉贯通，"六朝烟水"四字如墨笔淡扫，将千年兴废尽收尺幅。"过"字举重若轻，将王朝更迭的史诗解构为巷弄里飘过的一缕炊烟，与韦庄"六朝如梦鸟空啼"形成跨时空唱和。结句"夫子庙祈棂星门"如钟磬收韵，孔庙的棂星门不再是冰冷的石构，当诗人驻足祈愿，七十二贤的琅琅书声正穿透门楣，与时代的文化美学悄然共振。
`,
  "poems/04-suzhou.md": `# 苏州

> 枫林霜叶入姑苏，游园惊梦醉几壶。

---

## 蘇州

> 枫林霜叶入姑苏，游园惊梦醉几壶。
> 江南行舟秋意晚，渔火平江寒山孤。

———甲辰年·秋·魏书

![蘇州](../images/蘇州.jpg)

### 赏析

《蘇州》是一轴饱蘸吴地秋韵的水墨长卷，魏东坡以四句二十八字的玲珑尺幅，在枫红霜白间完成对姑苏城的诗学写意。

首句"枫林霜叶入姑蘇"点明深秋时节为画面奠定色彩基调，如杜牧《山行》"霜叶红于二月花"。"入"字极妙，恍若见丹枫乘着晚唐的月光，斑驳朱色浸染着千年姑苏的粉墙黛瓦。

次句"游园惊梦醉几壶"则如昆曲水磨腔般幽微，"游园惊梦"四字包含三层妙处：既实指苏州园林游览，又暗引昆曲经典剧目，更深藏杜丽娘"如花美眷，似水流年"的慨叹。"醉几壶"以酒量具象化诗情浓度，洒脱不羁，又以「醉」字勾连唐伯虎"酒醒只在花前坐"的吴门风流。

「江南行舟秋意晚」——苏州作为江南文脉的缩影，其秋色不似北地萧瑟，而是浸润着水汽的温润苍茫。"晚"字既指一日之暮，亦暗合深秋时节，赋予画面一种流逝中的永恒感。

末句「渔火平江寒山孤」呼应千古绝唱，"渔火"和"寒山孤"承继唐代张继《枫桥夜泊》"江枫渔火对愁眠"和"姑苏城外寒山寺"。诗人以"孤"字收束全篇——霜叶之绚烂、游园之酣醉、行舟之闲适，最终都归于渔火明灭中的永恒孤独。这种由闹入寂的收尾，深得王维"空山不见人"的禅意三昧。
`,
  "poems/05-xitang.md": `# 西塘

> 青砖黛瓦西塘径，小桥流水渡舟行。

---

## 江南古镇

> 西塘夜暮灯初上，银簪倩影照红妆。
> 烟雨长廊朝南埭，满船星河醉仙坊。

———甲辰年·夏·魏书

![江南古镇](../images/江南古镇.jpg)

### 赏析

此诗以精炼典雅之笔，生动描绘了江南水乡传统美学。

"西塘夜暮灯初上"——"暮灯初上"四个字就把黄昏到入夜的过程写活了，让人想起"月上柳梢头"的古典意境，瞬间渲染出古镇灯火阑珊的序幕。

"银簪倩影照红妆"巧妙地化用了苏轼"故烧高烛照红妆"，灯火映照下女子发簪的银辉与红妆的倩影倒映水中，营造出一种精致、含蓄、旖旎的情调，充满了东方婉约之美。

"烟雨长廊朝南埭"——"烟雨"是江南的永恒意象，也是历代诗人词家吟咏的经典元素（如"多少楼台烟雨中"、"山色空蒙雨亦奇"）。

"满船星河醉仙坊"——此句想象瑰丽，意境升华。"满船星河"堪称神来之笔，将停泊在河中的船只所倒映的灯光、星光、甚或是人们放下的河灯描绘成一片流淌在船边的璀璨星河。这既是对古典诗词中"星河"意象（如"醉后不知天在水，满船清梦压星河"）的绝妙化用，又契合了水乡夜景光影交融的特色。

通过对"夜暮灯河"、"簪影红妆"、"烟雨长廊"、"船映星河"的精炼描绘，全诗充满了视觉的动感、色彩的冷暖（暖光、银辉、红妆、烟雨青墨、星河璀璨）和空间的层次，深得中国传统绘画散点透视与虚实相生之妙。

---

## 江南水乡

> 青砖黛瓦西塘径，小桥流水渡舟行。
> 莫作江南不归客，垆边若雪惊鸿影。

———甲辰年·夏·魏书

![江南水乡](../images/江南水乡.jpg)

### 赏析

《江南水乡》以水墨点染之法，在四句间勾勒出江南灵韵的永恒胎动。

首句"青砖黛瓦西塘径"："青砖黛瓦"是江南古建筑最典型的色彩组合，立刻奠定了古朴、素雅的基调，勾勒出水乡的建筑轮廓。一个"径"字带出蜿蜒曲折的青石板路，引人步入画中。

次句"小桥流水渡舟行"将动态美学推至化境。石桥拱影暗合《考工记》"匠人营国"的几何智慧，舟楫划开的水痕恰是张旭狂草中的飞白笔势。渡舟载着的不仅是行人，更是韦庄"画船听雨眠"的唐风遗韵。

转句"莫作江南不归客"照见江南文化中「归与隐」的永恒命题。此句叩击着中国文人千年归去来兮的辩证漩涡，这声"莫作"既是白居易"能不忆江南"的千年回响，直指陶渊明"误落尘网中"的现代困境。

结句"垆边若雪惊鸿影"堪称点睛妙笔。垆边酒旗既是对卓文君当垆典故的化用，又暗藏杜牧"春风十里扬州路"的绮丽想象；"惊鸿影"非止于曹植洛神赋的形貌描摹，更似徐渭大写意中的墨韵留白——那惊鸿一瞥的刹那，实为吴门画派笔下永恒的刹那芳华。
`,
  "poems/06-qita-chengshi.md": `# 其他城市

> 千古圣贤皆过客，满天星河落人间。

---

## 谪仙人·长安（西安）

> 对酒当歌金樽浅，明月独酌醺谪仙。
> 千古圣贤皆过客，满天星河落人间。

———辛丑年·秋·魏书

![谪仙人·长安](../images/谪仙人长安.jpg)

### 赏析

魏东坡此作以李白风骨为魂魄，以浩瀚星河为笔墨，在四句二十八言间完成了一场跨越千年的精神对话。

开篇"对酒当歌金樽浅"用典精妙，将曹操《短歌行》的慷慨与李白《将进酒》的狂放熔铸一体。"金樽浅"三字别具匠心，既暗示宴饮未酣的余韵，又暗藏"酒樽虽小容天地"的哲学意趣。"明月独酌"以孤绝姿态突破传统对饮意象，月光浸透的杯影里，一个超脱时空的诗人形象跃然而出。

"千古圣贤皆过客"如惊雷破空，将个体生命置于历史长河审视。看似否定实则超越，以"过客"意象解构传统圣贤崇拜，又在解构中建构起诗性永恒的价值体系。这种对永恒的重新定义，既暗合李白"古来圣贤皆寂寞"的孤傲，又以更宏大的宇宙视角将个体生命提升至与星河对话的高度。

末句"满天星河落人间"堪称神来之笔，星河倾泻的壮美意象，既是对杜甫"星垂平野阔"的空间突破，又暗含苏轼"把酒问青天"的宇宙意识，以"落人间"三字道尽诗人眷恋人世、超而不遁的入世情怀。

诗中塑造的谪仙形象，既保持了传统文人"举杯邀月"的浪漫，又通过"星河落人间"的壮阔意象实现精神升华。此诗以有限的文字构建出无限的审美空间，既是对李太白诗魂的深情致意，更是对中华诗学精神的创造性传承。

---

## 太原行（太原）

> 晋阳故都汾河酒，暮色酩酊风满袖。
> 醉里浮云望归路，人间烟火古城楼。

———壬寅年·夏·魏书

![太原行](../images/太原行.jpg)

### 赏析

"晋阳故都汾河酒"——开篇即以地理符号"晋阳"（太原古称）与"汾酒"点明地域文化基因，将千年古城的历史厚重与山西名酿的酣畅融为一体，暗合李白"兰陵美酒郁金香"的物华意象，却又赋予三晋特有的苍茫底色。

"暮色酩酊风满袖"——通过"酩酊"与"风满袖"的感官叠加，构建疏狂落拓的谪仙意象。风灌衣袖的疏阔，令人联想苏轼"一蓑烟雨任平生"的旷达，而暮色中的醉态又透出几分阮籍式的孤寂，形成外放内敛的情感复调。

"醉里浮云望归路"——浮云飘渺喻人生行迹无定，"归路"二字则暗藏羁旅愁思。此句化用李白"浮云游子意"的飘零感，却以醉眼朦胧消解沉重，在朦胧中达成物我两忘的禅境，深具王维"行到水穷处，坐看云起时"的淡然哲思。

"人间烟火古城楼"——"人间烟火"既呼应首句"故都"，又以温暖市井气冲淡浮云归路的苍凉，形成情感闭环，余味如汾酒回甘。青砖古垒承载岁月，市井炊烟升腾生机。此间烟火非仅实指炊烟，更隐喻生生不息的世俗温情。在"浮云"与"烟火"的意象对仗中，延续了杜甫"感时花溅泪"的深沉，又注入现代人对历史痕迹的温情凝视。

---

## 登滕王阁（南昌）

> 书生意气觅封侯，指点江山几度秋。
> 把酒临风今何在？万古长江空自流。

———丙申年·秋·魏书

![登滕王阁](../images/登滕王阁.jpg)

### 赏析

魏东坡此作以滕王高阁为诗筏，以长江万古为墨池，简净笔触勾勒出登临怀古的苍茫意境，融个人襟抱与历史兴衰于一炉，在二十八字间完成了一场与王勃、李白的超时空对话。

首句"书生意气觅封侯"如金石裂帛，化用李贺"若个书生万户侯"的诘问，勾勒出传统文人的形象与抱负。"指点江山几度秋"以"指点"重构历史时空，将"觅封侯"的入世热望与"几度秋"的岁月流逝并置，形成理想与时间的初次碰撞。

转句"把酒临风今何在"如惊雷破空，"今何在"三字以天问姿态刺穿《滕王阁序》的华彩辞章，将个体存在抛入浩瀚时空——昔年宴饮的朱衣客、挥毫的王子安、醉月的李太白，皆在江风浩荡中化作齑粉。

结句"万古长江空自流"如暮鼓收韵，豪迈近苏轼"大江东去，浪淘尽，千古风流人物"，以大江永恒反衬功业空幻。"空自流"三字更具冷峭质感，在"自流"的从容中窥见庄子"天籁"的至境，令全诗在空阔中收束余响。

全诗贯穿着中国文人"入世-超脱"的精神张力，当"觅封侯"的锐气遭遇"空自流"的顿悟，当"指点江山"的豪情碰撞"万古长江"的苍茫，便织就一幅贯古通今的精神画卷。千年滕王阁所沉淀的历史回响与生命思考，更是对在历史长河与宇宙永恒前，那曾经热烈存在过的人文精神与个体生命的一曲深情挽歌。

---

## 鹧鸪天·洛阳怀古（洛阳）

> 断剑折戟沉沙中，残阳如血落苍穹。
> 将士埋骨荒草地，死后功名皆成空。
>
> 帝王术，古今同，烽火干戈图争雄。
> 只道君临天下梦，谁祭月下青衣冢？

———丙申年·秋·魏书

![鹧鸪天·洛阳怀古](../images/鹧鸪天洛阳怀古.jpg)

### 赏析

全诗以苍劲悲凉的笔触勾画历史烽烟，在古典词学的框架下展现出深厚的批判意识与人文情怀。

反战思辨——"断剑折戟沉沙中""将士埋骨荒草地"以冷兵器残骸与无名尸骨为意象，直指战争对生命的吞噬。将士"死后功名皆成空"的喟叹，与辛弃疾"了却君王天下事，赢得生前身后名。可怜白发生！"形成互文，但更强调功名的虚妄性，深化了反战主题。

批判权力本质——"帝王术，古今同"六字如史笔，揭破历代统治者"烽火干戈图争雄"的权谋本质，直刺权力游戏的循环宿命。

"青衣冢"这一独创意象尤具震撼力：区别于帝王陵寝的"冕旒冢"，"青衣"代指平民将士，其荒冢独对冷月，直指历史叙事中庶民话语的缺失。末句"谁祭月下青衣冢"以问叩天，较之陈陶"可怜无定河边骨"更添孤愤之气。

上片解构英雄史观（功名成空），下片解构帝王神话（权术循环），最终以"青衣冢"为无名者立碑。此与姜夔"今何许？凭阑怀古，残柳参差舞"的苍茫感相通，但更具平民视角的批判性。昔年东坡酹江月以吊英魂，今朝青衣冢独对千秋，两般境界，一种悲怀。

---

## 武侯祠（成都）

> 身蕴天地棋，心怀宇内计。
> 纶巾笑谈间，野火烧赤壁。

![武侯祠](../images/武侯祠.jpg)

### 赏析

此诗以极简笔墨勾勒诸葛亮的神采气度。"身蕴天地棋"写其胸中丘壑，以天下为棋局；"心怀宇内计"写其匡扶汉室之志。"纶巾笑谈间"以苏东坡"羽扇纶巾，谈笑间樯橹灰飞烟灭"笔法，再现孔明从容自若的儒将风范。末句"野火烧赤壁"以自然意象暗喻战争烈度，含蓄深沉，余韵悠长。

---

## 登越王楼（绵阳）

> 桂花酒酿沁云酥，明月独倚凤栖梧。
> 灯火阑珊伊人影，落墨诗卷几分孤。

———庚子年·秋·魏书

![登越王楼](../images/登越王楼.jpg)

### 赏析

魏东坡此作以故乡绵阳越王楼为砚，以秋夜孤光为墨，在二十八字间勾勒出一卷浸润桂香与月色的人文长轴。

"桂花"是中秋佳节的传统象征，承载着思乡怀远之意。"酒酿"与"沁云酥"结合，既写出了酒的醇香绵长，又以"云酥"一词赋予其轻盈飘渺的质感，仿佛酒香融入云端月色，极为风雅别致，有通感之妙。

"明月"是古典诗词永恒的母题，象征澄澈、团圆或孤寂。"凤栖梧"典出《诗经·大雅·卷阿》"凤凰鸣矣，于彼高冈。梧桐生矣，于彼朝阳。"梧桐是高贵祥瑞之树，凤凰非梧桐不栖。明月"独倚"凤栖之梧，既勾勒出清冷高远的画面，更暗喻了登临之地（越王楼）的高雅与历史厚重感，同时"独"字奠定了全诗的孤清基调，以高贵之物衬孤寂之情，意境倍增。

"灯火阑珊"化用辛弃疾"蓦然回首，那人却在，灯火阑珊处"。此处点出秋夜将尽，灯火稀疏之境。"落墨"是文人雅士日常，"诗卷"承载其心志。在月色梧影、阑珊灯火与人影的背景下，诗人伏案书写，最终感受到的是"几分孤"——这不仅指外在环境的冷清，更指向文人内心深处难以排遣的孤高情怀或对知音难觅的感喟。

全诗不着一个直接抒情的字眼，然情思无处不在。典故如盐入水，了无痕迹，增添了诗词的文化底蕴和深沉意味。整体格调高华，境界清远超迈。

---

## 海南·致定风波（儋州）

> 谪居儋州撷菜荒，翰墨丹青载酒堂。
> 隐入尘烟不归客，此心安处是吾乡。

———壬寅年·冬·魏书

![海南·致定风波](../images/海南致定风波.jpg)

### 赏析

诗中"谪居儋州撷菜荒"，引用典故"问汝平生功绩，黄州惠州儋州"。北宋绍圣四年，苏轼因党争再贬海南，彼时儋州荒僻瘴疠，生活艰苦，苏轼却开荒种菜、采药著述，以"撷菜""载酒"化苦难为诗意。此句以"菜荒"暗喻生存之艰，又以"撷"字赋予主动接纳的从容，凸显士大夫于逆境中自力更生的坚韧。

"翰墨丹青载酒堂"浓缩苏轼在海南的文化贡献。"载酒堂"是苏轼讲学之所，他在此传播中原文化，收黎族学子为徒，以诗书翰墨滋养蛮荒之地。

"隐入尘烟不归客"以"尘烟"喻指世俗纷扰与人生漂泊，而"不归客"暗含苏轼决意扎根海南、超越政治浮沉的态度。此句化用陶渊明"归去来兮"的隐逸意象，却更进一步：非避世而逃，乃主动融入民间。

"此心安处是吾乡"直接引用苏轼《定风波·南海归赠王定国侍人寓娘》名句，亦是全诗精神内核。苏轼在海南作《别海南黎民表》云："我本海南民，寄生西蜀州"，以他乡为故乡的豁达，打破地理疆界与身份执念。此句将儒家"安贫乐道"与禅宗"心外无物"交融，成就古典士大夫"无处不家园"的至高境界。

> 东钱湖畔雾生烟，柔波寻岸雨漪涟。
> 儒生不羡匹夫勇，江山社稷笑谈间。

———壬辰年·夏·魏书

## 清明祭

> 青山孤烟旧时光，浮生若梦忆仓惶。
> 墓铭不忧身后事，悲苦埋葬荒草乡。

———辛丑年·春·魏书

![清明祭](../images/清明祭.jpg)

### 赏析

从古典传统文化角度赏析，结合清明文化内涵、古典意象运用及生死哲思：

"清明"既指节气，亦承载祭扫追思的千年礼俗。杜牧"清明时节雨纷纷"以雨写哀，奠定清明诗愁绪基调。"雨上"——雨在传统文化中既是天地交感之泪，又是涤荡尘寰的媒介，此处暗含登高望祭、沟通阴阳的仪式感，呼应《楚辞》中"云霏霏而承宇"的天地对话传统。

"青山孤烟"化用王维"大漠孤烟直"的苍茫，却以青山为底色，暗合"青山是处可埋骨"（苏轼）的生死旷达。"孤烟"既指祭扫焚纸的烟缕，又是儿时炊烟袅袅升起，呼应《古诗十九首》"人生寄一世，奄忽若飙尘"。

"浮生若梦"直引李白《春夜宴桃李园序》"浮生若梦，为欢几何"，而"忆仓惶"三字注入历史厚重感。仓惶暗含战乱离丧（如杜甫"仓惶已就长途往"），揭示清明不仅是家祭，更是对集体历史创伤的追忆。

"墓铭不忧"反用传统墓志铭的功德铭记，以"不忧身后事"展现道家生死观（《庄子》"死生为昼夜"）。"悲苦埋葬"非沉溺哀伤，而似白居易"野火烧不尽"的草木轮回观。末句"荒草乡"将个体悲苦纳入历史长河，效法陈子昂"念天地之悠悠"的宇宙视野。

全诗淋着杜牧"路上行人欲断魂"的千年愁雨，在"青山埋骨"与"浮生若梦"的辩证中，既延续了清明"追远"的伦理本质（《论语》慎终追远），又以荒草湮没悲苦的姿态，昭示中华文化向死而生的生命智慧。

## 江城子·清明

> 浮生若梦枕黄粱，夜未央，似寻常。穗帏设奠，呈孝叩灵堂。聒碎声里忆仓皇，浑浊泪，鬓角霜。
>
> 孤山荒冢立苍茫，清明雨，断人肠。纸钱檀香，恍惚旧时光。墓铭不忧红尘事，悲苦葬，荒草乡。

———丁酉年·春·魏书

![江城子·清明](../images/江城子清明.jpg)

### 赏析

这首《江城子·清明》以传统悼亡题材为底色，融合古典意象与深沉情感，在音韵、意境、手法上均展现出对宋词传统的继承与创新。

"浮生若梦枕黄粱"开篇即化用《枕中记》黄粱一梦典故，将人生短暂与虚幻感融入清明祭奠场景，与苏轼"世事一场大梦"（《西江月》）的苍茫感遥相呼应。"穗帏设奠，呈孝叩灵堂"以丧仪细节强化肃穆哀思，以仪礼的庄重反衬内心的崩裂。

"聒碎声里忆仓皇"陡转，用声音碎片撕开记忆伤痕，重现逝者离世时的惶乱。"孤山荒冢立苍茫"——"孤山"在古典诗词中常象征遗世独立，而"荒冢"直指生死命题。"立"字赋予荒冢以雕塑般的凝固感，恍见苏轼"千里孤坟无处话凄凉"的苍凉，凸显逝者在时空中的永恒孤独。

"鬓角霜"以容颜衰颓喻愁苦，与苏轼"尘满面，鬓如霜"的沧桑感呼应；"清明雨"三字凝练如刀，既写实景湿冷，更暗合千年祭扫的集体哀伤，雨丝如泪，天地同悲。"断人肠"化用《楚辞》"魂一夕而九逝"的痛感，直指生死永隔之恸。

此词深植于宋代悼亡词脉络：情感上承袭秦观之婉曲、苏轼之沉郁；意象运用近法杜牧之凝练；结构上融合虚实相生与时空跳跃，在传统框架中注入个人化表达。尤为可贵者，是将"孝祭"与"自悼"结合，使私己哀思升华为对生命本质的叩问。

## 端午

> 仲夏青艾糯粽香，荔红梅酸又端阳。
> 龙舟争渡千年赛，门挂菖蒲念安康。

———甲辰年·夏·魏书

![端午](../images/端午.jpg)

### 赏析

这首《端午》以传统笔墨勾勒出仲夏端阳的民俗画卷。

首句"仲夏青艾糯粽香"以《夏小正》"五月蓄兰为沐浴"的古礼为基底，青艾剑气般劈开溽暑瘴疠，糯粽的棱角暗藏《楚辞·招魂》的祭仪形制。"荔红梅酸又端阳"巧妙运用五色五味的通感修辞，青艾之翠与荔红之艳形成视觉冲和，糯粽的咸甜与梅子的酸涩构成味觉对仗。"又"字如龙舟桨橹划开时间涟漪，在岁岁重复中完成《周易·复卦》"反复其道"的仪式循环。

"龙舟争渡千年赛"化用《隋书·地理志》"屈原以五月五日投汨罗江，楚人哀之，皆以舟楫拯救"的典故，以"千年"凸显民俗活动的历史纵深。桡影翻飞处，《荆楚岁时记》"五月五日竞渡"的南朝旧俗与苏轼"楚人悲屈原，千载意未歇"的北宋咏叹同频共振。

全诗深得《周易》"观物取象"之旨，物象选择皆具文化象征：艾草避邪、龙舟招魂、菖蒲祛毒。尾句"念安康"三字，既承续《楚辞·九歌》的忧患意识，又以《黄帝内经》"正气存内，邪不可干"的养生智慧作结，将节俗表象升华为对生命本体的终极关怀。

## 鹊桥仙·七夕

> 天上仙阙，山河初秋，花灯星汉夜游。秋水凌波纤云柔，与卿青丝共白首。
>
> 江南初见，明眸美目，笑看欲语还羞。少年诗酒倚西楼，月如钩，挂上心头。

———癸卯年·秋·魏书

![鹊桥仙·七夕](../images/鹊桥仙七夕.jpg)

### 赏析

这首词以七夕为背景，将天上人间的浪漫意象与人间情愫巧妙编织，既有传统节日的古典韵味，又融入个人情感的细腻表达。

上阕以"仙阙"起笔，缀以"山河初秋""花灯夜游"，将星河传说与人间乞巧习俗相糅（唐宋即有七夕观灯风俗），承袭秦观《鹊桥仙》"纤云弄巧，飞星传恨"之笔法而更显欢愉。"与卿青丝共白首"一句由神话瞬时切至现实情誓，恍若东坡"但愿人长久，千里共婵娟"和《诗经》"执子之手，与子偕老"的今古同辉之境。

"秋水凌波纤云柔"化用曹植《洛神赋》"凌波微步，罗袜生尘"的意象体系，却以"纤云柔"赋予现代爱情的温婉质地。下阕"江南初见"场景的时空转换——从广角镜头的山河星汉，骤然推近至江南水巷的惊鸿一瞥。"明眸美目"既暗合《诗经》"美目盼兮"的古雅，又以"笑看欲语还羞"的白描手法，展现当代爱情中欲说还休的微妙情态。

「西楼」自李后主「寂寞梧桐深院锁清秋」始，便成为古典诗词中承载孤寂的经典符号；「月如钩」更直引李煜「无言独上西楼，月如钩」的冷寂意境。「少年诗酒」的放达与「月如钩」的幽微形成张力美学，而「挂上心头」的戛然收束，恰似中式美学留白。

全词严守《鹊桥仙》双调五十六字体式，上下阕首二句对仗工稳。银树花火是写意泼洒的盛世，笺纸鎏金是工笔勾勒的雅士情致，星河垂野尽显宇宙苍茫，人间笑语犹存烟火温情。

## 青玉案·元夕

> 南宋御街古巷祈，清河坊、折子戏。笺纸风雅落灯谜。火树银花，细雕鎏金，宫兔夙如意。
>
> 江南杭城长相忆，宋韵游客满市集。旧岁爆竹声声里。天上星河，人间烟火，今宵又元夕。

———癸卯年·春·魏书

![青玉案·元夕](../images/青玉案元夕.jpg)

### 赏析

魏东坡此作以元宵盛景为载体，巧妙融合宋韵遗风与传统节俗，在长短句间泼洒出一卷浸润宋韵的画卷。

上阕「南宋御街古巷祈」"火树银花"、"宫兔"（花灯）、"折子戏"、"灯谜"、"爆竹"、"市集"，这些词句浓墨重彩地描绘了元宵夜赏花灯、看百戏、猜灯谜、逛集市的热闹景象，是对古典元宵意象体系的完美继承。"笺纸风雅落灯谜"一句尤其出色，笺纸是文人雅士书写之物，灯谜是节日大众娱乐，将二者巧妙结合，既体现文人趣味，又不脱节日市井气息，再现了宋人"雅俗共赏"的文化生活风貌。

"火树银花"化用苏味道《正月十五夜》经典意象，却以"细雕鎏金"赋予新解：鎏金宫灯与玉兔灯笼（"宫兔"）呼应南宋宫廷灯彩技艺。灯火意象群集束呈现，既延续"东风夜放花千树"的浪漫传统，又以雕刻细节彰显江南工艺之极致。

下阕「江南杭城长相忆」转韵，宋韵游客的绣鞋踏过青砖，恰似辛弃疾词中"笑语盈盈暗香去"的南宋仕女穿越时空而来。"旧岁爆竹声声里"如焦墨点睛，硫磺气息穿透纸窗，在《清明上河图》的南宋御街与西湖断桥间激荡文明更迭的回声。

"天上星河，人间烟火"以垂直空间构建古典诗词中宏大宇宙观，星河亘古流转对应人间烟火刹那绚烂。结句"今宵又元夕"余音袅袅，既是节俗的轮回，也是文化血脉的赓续，写出了传统节日在时光流转中永恒的生命力。

## 水调歌头·中秋

> 明月几时逢？醉卧广寒宫。不知天涯倦旅，何处认归踪。饮酒醉眼朦胧，少年轻狂殆尽，冷落清秋梦。莫道黯乡魂，多情故园风。
>
> 叹流光，起彷徨，忆相逢。此恨无穷，浮生一霎似孤鸿。千里明月尽望，万家灯火情浓，叹天高地迥。何时共明月，闲语小楼中。

———庚寅年·秋·魏书

![水调歌头·中秋](../images/水调歌头中秋.jpg)

### 赏析

"明月几时逢？醉卧广寒宫"开篇化用苏轼"明月几时有"之问，更将"广寒宫"神话引入，赋予月色以仙逸之气。此典源于《淮南子》嫦娥奔月传说，而"醉卧"二字续写李白"我醉欲眠卿且去"的疏狂，融合了士大夫的浪漫与道家的超脱。

"不知天涯倦旅，何处认归踪"承袭唐诗羁旅传统，以"孤鸿"（杜甫"飘飘何所似，天地一沙鸥"）隐喻人生漂泊，而"浮生一霎"更呼应庄子"人生天地间，若白驹过隙"的哲学叩问，在有限时空里展开对永恒的追索。

"少年轻狂殆尽，冷落清秋梦"暗含辛弃疾"少年不识愁滋味"的顿挫，而"莫道黯乡魂"反用范仲淹"黯乡魂，追旅思"，将个人离愁升华为对故园文化的集体眷恋。

"千里明月尽望，万家灯火情浓"化用张九龄"海上生明月，天涯共此时"，却以"灯火"注入人间暖意。此句构建"天-人"二元结构：明月象征宇宙永恒，灯火隐喻尘世温情，在"叹天高地迥"的苍茫中，彰显儒家"此心安处是吾乡"的生命韧性。

全词严守《水调歌头》双调九十五字格律，前段押平韵营造清冷秋境，后段转悠扬韵脚，形成"起-伏-扬"的情感曲线，深得苏轼"声情掩映"之妙。这是张若虚《春江花月夜》"人生代代无穷已，江月年年望相似"的千年回响。

## 冬雪

> 岁暮天寒落屋檐，红炉醅酒又一年。
> 半身风雪渡南巷，万家灯火看人间。

———辛丑年·冬·魏书

![冬雪](../images/冬雪.jpg)

### 赏析

魏东坡此作以岁暮寒江为砚，以万家灯火为墨，在二十八字间晕染出一卷冷暖交织的冬夜长轴。

开篇直指"岁暮"，点明隆冬时节，"天寒"与"雪落屋檐"共同营造出天地寂寥、寒气砭骨的氛围。"落屋檐"三字尤为精妙，将漫天飞雪聚焦于一角屋檐的动态过程，画面感十足，天地之大与檐角之小形成对比，暗示着个体在宏大时空中的渺小感。

次句"红炉醅酒又一年"暗合白居易"绿蚁新醅酒"的闲适。炉火之"红"与冰雪之白形成鲜明视觉和温度对比，是寒冬中唯一的温暖亮色。

转句"半身风雪渡南巷"堪称神来之笔，"渡"字更有分量，仿佛风雪是浩渺之水，行人需奋力泅渡，赋予风雪空间上的阻滞感和艰辛感，"南巷"是杭州的南宋御街，典型的江南意象，也是文人墨客归宿。

结句"万家灯火看人间"最震撼是"看人间"的视角升华——前面三句都是近景特写，突然拉开上帝视角，蕴含张若虚"江畔何人初见月"的苍茫，但又不完全飘在天上，因为"万家灯火"还留着人间的温度。个体的孤旅在星罗棋布的暖光中消融，从置身其中的"渡"变为超然物外的"看"，诗人精神得以从风雪困境中抽离，与杜甫"安得广厦千万间"的忧思形成时空对话，却以"看"字的超然姿态，将悲悯升华为静观天地的彻悟。

这首《冬雪》如同一幅宋人小景：寒雪压檐，炉火微醺，风雪夜行之人在巷陌间跋涉，最终被一片人间星火抚慰。结句"万家灯火看人间"尤其震撼，于风雪尽头见人间情热，正是这首小诗最动人之处。

---

## 婚喜

> 眉黛朱砂镜红妆，凤冠霞帔着霓裳。
> 翩若浮云惊鸿影，金玉良缘喜鸳鸯。

———癸卯年·春·魏书

![婚喜](../images/婚喜.jpg)

### 赏析

魏东坡此作以红妆为砚，以鸾凤为墨，在四句二十八字间织就一卷浸润《诗经》古韵的婚典长轴。

"眉黛朱砂镜红妆"开篇便聚焦新娘妆扮的核心元素。"眉黛"点明精心描绘的眉毛，"朱砂"与"红妆"共同构建了鲜艳、喜庆的红色基调，符合传统婚嫁习俗中对红色（象征吉祥、避邪、热烈）的偏爱。一个对镜梳妆，期待又娇羞的新娘形象呼之欲出。

"凤冠霞帔着霓裳"此句直击传统婚礼中最为华丽、尊贵的新娘礼服。"凤冠霞帔"是明代以降命妇乃至高门新娘的正式礼服，象征着地位尊荣和婚姻的庄重。"霓裳"则用仙女霓裳羽衣的典故，形容嫁衣如同彩霞般绚烂美丽、飘逸不凡。

"翩若浮云惊鸿影"此句化用曹植《洛神赋》"翩若惊鸿，婉若游龙"的意象，赋予新娘以洛神般的超凡气韵。"翩若浮云"形容新娘步履轻盈、身姿飘逸如云；"惊鸿影"则传承了陆游"曾是惊鸿照影来"的美学，如同惊飞的鸿雁掠过水面留下的惊艳倒影。

"金玉良缘喜鸳鸯"尾句是整首诗的画龙点睛之笔和主旨升华。"金玉良缘"指天作之合的宝贵姻缘，"鸳鸯"是中国传统文化中象征忠贞爱情、夫妻恩爱的经典意象。"喜鸳鸯"不仅点明婚礼主角是成双成对的新人，更直接表达了"百年好合，永结同心"的核心祝福。它集仪式感、华美度、祝福性于一体，是对传统婚礼之美最地道的礼赞诗。

---

## 观日出

> 红日初升曜东方，朝观天道万丈光。
> 万物得其恩泽生，冬去春来似寻常。

———癸卯年·魏书

![观日出](../images/观日出.jpg)

### 赏析

《观日出》一诗以红日初升之景入笔，语言凝练而气象恢弘，深得古典诗词"以象载道"之精髓。

"红日初升曜东方"——开篇以"红日"为核，承袭古典诗词中日出的光明象征（如李白"朝辞白帝彩云间"的蓬勃），更以"曜"字强化其穿透力，暗合《楚辞》"暾将出兮东方"的神圣性。而"东方"不仅定方位，更呼应《周易》"帝出乎震"的方位哲学，喻示天道运行的起点。

"朝观天道万丈光"——由景入理，"天道"二字将自然现象升华为宇宙法则。此句化用宋代理学"格物致知"之理，将视觉之"观"转为心智之"悟"，万丈光芒既是实景，亦隐喻天道之无穷。

"万物得其恩泽生"与杜甫"葵藿倾太阳，物性固莫夺"异曲同工，强调日光普施无私，万物仰赖其德而生，暗合儒家"仁德化育"的宇宙观。

"冬去春来似寻常"——末句以举重若轻之笔收束全诗。"冬去春来"浓缩四时更迭，呼应《周易》"寒往则暑来"的循环天道；而"似寻常"三字看似平淡，实则深藏禅机：至高的天道往往蕴于日常。此境界近于陶渊明"此中有真意，欲辨已忘言"的化境——在习以为常中窥见永恒。

全诗融合了儒家的济世情怀（恩泽万物）、道家的自然观（四时循环）与禅宗的平常心（似寻常），在观日出的瞬间达成天人合一的感悟，延续了自《诗经》"明明上天，照临下土"以来，中华诗学对天道的礼赞传统。

---

## 黄昏

> 浮生似梦惜流芳，
> 清风无声独自凉。
> 夕阳如画终向晚，
> 一曲离殇断人肠。

———庚寅年·秋·魏书

![黄昏](../images/黄昏.jpg)

### 赏析

此诗以"黄昏"为题，四句层层递进，从浮生若梦的感慨到夕阳向晚的意象，最终以"一曲离殇断人肠"收束，情感深沉婉转。"清风无声独自凉"以触觉写孤独，"夕阳如画终向晚"以视觉写时光流逝之不可挽留。全诗延续了古典诗词中"日暮客愁新"的抒情传统，在简淡笔触中寄寓深沉的时光之叹。

  "poems/08-huaigu.md": `# 咏史怀古

> 千古兴亡多少恨，大江东去旧衣冠。

---

## 西楚霸王

> 巨鹿沉舟破秦关，鸿门惊宴剑舞寒。
> 屠戮咸阳焚三月，睢水鸿沟分楚汉。
> 垓下败逃骓不逝，霸王别姬泪潸然。
> 千古兴亡多少恨，大江东去旧衣冠。

———甲辰年·夏·魏书

![西楚霸王](../images/西楚霸王.jpg)

### 赏析

全诗贯穿项羽生平关键节点：巨鹿之战（"巨鹿沉舟破秦关"）"沉舟"化用"破釜沉舟"典故；鸿门宴（"鸿门惊宴剑舞寒"）"剑舞寒"三字浓缩范增设计诛杀刘邦未果的凶险；火烧咸阳（"屠戮咸阳焚三月"）直指其暴行失民心；楚汉相争（"睢水鸿沟分楚汉"）以"鸿沟"喻战略转折。

从巨鹿（前207年）至垓下（前202年），以五年霸业兴衰为经，以地理位移为纬，构建出史诗级时空框架，效法杜甫《咏怀古迹》的"以地系史"手法，气象恢宏。

"骓不逝"直引项羽《垓下歌》原句，借战马踟蹰喻英雄末路；"泪潸然"与"剑舞寒"形成刚柔对照：前者写别姬之柔肠，后者写宴席之杀机，凸显项羽性格的矛盾性——勇武盖世却优柔寡断。

尾联"千古兴亡多少恨"跳出杜牧"卷土重来未可知"的假设，亦未取李清照"不肯过江东"的礼赞，而是以"恨"字统摄全篇——既含项羽之遗恨，亦寓历史兴废之共恨。"旧衣冠"暗藏诗眼：项羽之死象征先秦贵族精神的消亡。其宁死不渡乌江，恰如孔子"君子死而冠不免"的气节。此诗不仅咏项羽，更为"重义轻生"的古典英雄精神立碑。

---

## 沁园春·雪

> 雪舞苍山，漫地银霜，枯木寂寥。望苍穹深处，似隐天道。雾霭缭绕，踏破初晓。满腹经纶，尝尽苦寒，欲与天公试比高。凌云志，誓要登临道，俯瞰九霄。
>
> 千古风流人物，湮灭青史难争今朝。叹屈平忧柔，空赋离骚，霸王无谋，垓下兵逃。孟德自恃，乱世枭雄，铜雀未能锁二乔。皆成空，归来众山小，风华正茂。

———丙申年·冬·魏书

![沁园春·雪](../images/沁园春雪.jpg)

### 赏析

**自然意象的雄浑之美**——"雪舞苍山，漫地银霜"以泼墨式笔法勾勒出冰雪覆盖的苍茫山野，与古典山水画中"寒林雪霁"的意境相通。"枯木寂寥"暗含《庄子·齐物论》"形固可使如槁木"的哲学意象，喻示冬藏待发的自然轮回。

**天道意象的玄妙哲思**——"望苍穹深处，似隐天道"将视觉升华为宇宙追问，效法屈原《天问》对浩渺天道的探索。雾霭缭绕中"踏破初晓"的动态描写，暗合《周易·乾卦》"终日乾乾，与时偕行"的进取精神。

**对历史悲剧的深度反思**——下阕以"屈平忧柔""霸王无谋""孟德自恃"为典型，揭示传统英雄的局限：屈原忠而见弃，空留《离骚》悲鸣；项羽刚愎失策，垓下之败成兵家反鉴；曹操虽为枭雄，"铜雀春深"终成虚妄。

"欲与天公试比高"的磅礴气概，直承毛泽东原词中"欲与天公试比高"的挑战意识，而"誓要登临道"进一步将"天道"从敬畏对象转化为攀登目标，体现《孟子》"上下与天地同流"的儒家担当。全词以"凌云志"起笔，以"风华正茂"收束，将"修身齐家治国平天下"的儒家理想，熔铸于冰雪淬炼的刚健气质中。

---

## 念奴娇

> 亘古冰峰，耸千丈，苍山岿然不动。白雪皑皑，望眼处，北麓横卧苍穹。经天纬地，斗转星移，览乾坤无穷。独立寒巅，流尽岁月峥嵘。
>
> 青史笔墨厚重，留无数英雄，江山如梦。勾践藏锋，笠泽战，铁蹄踏破长空。汉祖平庸，屈身赴鸿门，意气江东。诗酒临风，凌云其乐无穷。

———戊戌年·冬·魏书

![念奴娇](../images/念奴娇.jpg)

### 赏析

上阕以西部雪山为原型，以"亘古冰峰""白雪皑皑"突出"岿然不动"的静态永恒感。"经天纬地，斗转星移"暗合《周易》宇宙观。"独立寒巅"化用毛主席"独立寒秋"的孤绝，而"流尽岁月峥嵘"则以拟人手法凝缩历史长河，呼应苏轼"大江东去，浪淘尽千古风流人物"的沧桑感。

下阕突破"成王败寇"史观：勾践的隐忍（藏锋）与项羽的桀骜（意气）并置，暗示英雄精神的多元性。末句"诗酒临风，凌云其乐无穷"以李白式的飘逸收束全篇，其"乐"非俗世欢愉，而是勘破历史兴亡后与天地共适的旷达，直追苏轼"一尊还酹江月"的宇宙意识。

此词深得宋人神髓而更具现代性：继承苏轼"大江东去"的历史苍茫、辛弃疾"气吞万里"的英雄气概，打破"怀古必伤今"的窠臼，以"凌云其乐无穷"将个体生命安顿于永恒自然，为传统词境注入现代生命哲学。

---

## 临江仙

> 落樱成雪暮春游，碑文悼墨若孤。叹千古风流人物。昔时流觞词，今朝皆尘土。
>
> 名垂青史英雄梦，雄心豪迈如初。望苍茫山峦隐路。他日凌绝顶，主天地沉浮。

———丙申年·春·魏书

![临江仙](../images/临江仙.jpg)

### 赏析

《临江仙》一词以落樱为引、碑文为镜，在暮春的绚烂与寂灭间叩问存在本质，展开一场横跨千年的精神远征。

上阕"落樱成雪"以物哀美学开篇，落花如雪暮春之实景引发生命短暂、繁华易逝之叹。"叹千古风流人物"巧妙化用苏轼"大江东去，浪淘尽，千古风流人物"，将读者瞬间带入历史长河的语境。"昔时流觞词，今朝皆尘土"此处用《兰亭集序》"曲水流觞"的著名典故，描绘昔日文人雅集、诗酒风流的盛况，与"皆尘土"形成强烈对比，深刻体现了古典诗词中对时间流逝与世事无常的哲思。

下阕"名垂青史英雄梦，雄心豪迈如初"，词人并未沉溺于怀古的伤感与虚无，而是从历史人物、前贤身上汲取力量，体现了中国士大夫"明知不可为而为之"、"天行健，君子以自强不息"的积极进取精神。

"他日凌绝顶，主天地沉浮"结尾两句气魄非凡，直引杜甫"会当凌绝顶，一览众山小"的诗意，表达登顶的志向，气势磅礴。全词融合了儒家进取（名垂青史、主天地沉浮）、道家超越（凌绝顶、观苍茫）以及对生命价值的深刻体悟，完美地继承了苏辛豪放词以来的雄浑气魄与深沉哲思。

---

## 少年游

> 伫立圣山仰天道，一代天骄身寂寥。
> 千古英雄俱往矣，风流人物看今朝。

———癸卯年·夏·魏书

![少年游](../images/少年游.jpg)

### 赏析

"伫立圣山仰天道"开篇起势苍茫，"圣山"在传统诗词里常象征崇高理想，"伫立"显其凝思沉郁，"仰天道"则心怀敬畏，追问苍穹。此句直追屈子《天问》与陈子昂《登幽州台歌》的苍茫气象。

"一代天骄身寂寥"将目光投向历史长河中的至高英雄，"一代天骄"用成吉思汗典故，"身寂寥"三字力透纸背，道出英雄身处巅峰时的孤绝之境与辉煌背后的空寂感伤。

"千古英雄俱往矣"此句笔锋陡然荡开，气象宏大，其气魄与沧桑感直逼苏轼"大江东去，浪淘尽，千古风流人物"以及辛弃疾"千古兴亡多少事？悠悠。不尽长江滚滚流"。

"风流人物看今朝"承千古之叹后，诗意陡然转折，落脚于"今朝"。这是全诗的"诗眼"，亦是精神之升华。末句"风流人物看今朝"之气势与立意，清晰可见对毛泽东《沁园春·雪》中"数风流人物，还看今朝"的巧妙化用与致敬。

全诗以雄浑苍茫的意境起兴，诗由仰观天道，到对历史英雄充满深沉的悲悯与喟叹，再到纵览千古英雄，最终以无比豪迈的气概收束于对当世"风流人物"的激赏，一气呵成，酣畅淋漓。
`,
  "poems/09-yongwu-shuhuai.md": `# 咏物抒怀

> 功名利禄似云烟，春去秋来忙偷闲。

---

## 金沙滩

> 海纳百川怀天下，千古沉浮任由它。
> 礁石竦峙惊涛岸，卷尽狂澜浪淘沙。

———壬寅年·夏·魏书

![金沙滩](../images/金沙滩.jpg)

### 赏析

"海纳百川怀天下"化用《庄子·秋水》"天下之水莫大于海"及林宽《歌风台》"海纳百川容乃大"之典，以海洋的浩瀚喻胸怀之广博。此句暗合《中庸》"致中和，天地位焉"的宇宙观，将自然景象升华为天人合一的境界。与曹操《观沧海》"水何澹澹，山岛竦峙"的雄浑气象一脉相承，展现吞吐天地的格局。

"礁石竦峙惊涛岸"呼应曹操诗中"山岛竦峙"的坚毅意象，同时暗合《观沧海》"洪波涌起"的动荡感。礁石象征逆境中的定力，与惊涛形成刚柔对抗，构成张力十足的画面。

"千古沉浮任由它"暗合苏轼"小舟从此逝，江海寄余生"（《临江仙》）的旷达。诗人以海洋永恒对比人世浮沉，彰显道家"顺应自然"的智慧。

"卷尽狂澜浪淘沙"取意苏轼《念奴娇》"大江东去，浪淘尽，千古风流人物"，以海浪冲刷喻历史对生命的筛选。此意象承载了咏史诗中常见的沧桑哲思，如辛弃疾"千古兴亡多少事？悠悠。不尽长江滚滚流"的时空浩叹。

此诗突破传统"江河抒情"范式（如李白"黄河落天走东海"），将海洋从地理符号升华为精神自由象征、文明对话载体、永恒哲思镜像。在形式上承袭了"意象并置"（海-礁-浪）、"时空交响"（千古-瞬间）等古典技法，在精神上融汇了儒家的进取、道家的超脱与咏史诗的理性。

---

## 归隐

> 功名利禄似云烟，春去秋来忙偷闲。
> 阅尽帝王千古梦，不若诗酒锄作田。

———丁酉年·夏·魏书

![归隐](../images/归隐.jpg)

### 赏析

这首诗以简洁蕴藉的笔触，勾勒出一幅超脱尘网、拥抱人生的精神图景。

开篇"功名利禄似云烟"即奠定全诗基调，以"云烟"喻浮名虚利，轻盈飘渺、转瞬即逝。此意象与表达与老庄哲学"至人无己，神人无功，圣人无名"（《庄子·逍遥游》）以及历代隐逸诗的超脱思想一脉相承。陶渊明"富贵非吾愿，帝乡不可期"（《归去来兮辞》），李白"功名富贵若长在，汉水亦应西北流"（《江上吟》）皆是此意。

"春去秋来忙偷闲"之"偷"字用得极妙。将本是辛劳、被动的"忙"，赋予一种主动选择、略带狡黠的"偷闲"意味。这"偷"字既含无奈，亦含智慧，更是对尘嚣的一种抵抗和超脱，体现了在夹缝中守护内心平静的生存策略，极具文人智慧与生活情趣。

"阅尽帝王千古梦"将个体经验推广至历史维度，以"帝王千古梦"对功名利禄进行更深远的解构。"不若诗酒锄作田"是全篇转换的核心，带出一种放下后的洒脱与积极——"诗酒锄作田"既承陶渊明"归园田居"的精神，又融入当代人对诗意生活的向往。

全诗深植于老庄的哲学根脉，淬炼着唐宋的辞章精髓，又呼应着现代人的心灵渴求。诗中展现的精神风骨是对尘嚣的清醒、对价值的重估、对生命的珍视与诗化——正是华夏文脉中历久弥新的风流所在。

## 江南雪

> 今朝大雪美如画，吾欲吟诗赠天下。
> 奈何胸中无点墨，哎呀卧槽雪好大。

———壬寅年·冬·魏书

![江南雪](../images/江南雪.jpg)

### 赏析

首三句"今朝大雪美如画，吾欲吟诗赠天下。奈何胸中无点墨"延续古典雅言传统："美如画"暗合宋代王琪"江南雪，轻素剪云端"的工笔意境；"赠天下"则显唐代诗人赠答天下的胸怀格局。

末句"哎呀卧槽雪好大"以市井俚语破局，仿若《诗经》中"亦已焉哉"的直白咏叹，亦似敦煌曲子词"枕前发尽千般愿"的率真，更与唐代张打油"黄狗身上白，白狗身上肿"的俳谐体一脉相承。这种反差形成"庄谐互见"的张力，恰是古典"打油诗"传统的现代回响。

"胸中无点墨"表面自谦才疏，实则暗藏典故：李白登黄鹤楼见崔颢诗而叹"眼前有景道不得"的扼腕，苏轼"腹有诗书气自华"的反衬，凸显创作者对"诗以言志"的敬畏。这种自嘲恰是古典文人"诗穷而后工"精神的戏谑表达。

"雪好大"以白话颠覆江南雪的传统意象——古典江南雪多写"轻素剪云端"（王琪）的清雅，而"雪好大"的粗犷呼号，直追蔡戡"江南雪片一冬深，欺压梅花瘦不禁"的浑厚笔力，将江南雪从阴柔美学推向雄浑之境。

此诗似俚实雅：形上融市井呼号入诗，承白居易"老妪能解"的平民诗学；意上以俗语写天工，暗合庄子"天地有大美而不言"的哲思；神上借"东坡"之魂，托举即兴之趣，完成对古典精神的诙谐再造。恰如壬寅冬这场江南雪——在"哎呀卧槽"的惊叹里，千年诗脉与当代灵魂击掌相和。

---

## 江南春月夜

> 庭香暗溢透薄纱，玉簟欹枕冷月华。
> 春风不解怜花情，犹自吹落梦中花。

———壬寅年·春·魏书

![江南春月夜](../images/江南春月夜.jpg)

### 赏析

魏东坡此作以春庭为砚，以月华为墨勾勒出一卷浸润唐宋风骨的江南春月夜。

首句「庭香暗溢透薄纱」如宋人纨扇上的工笔写意，将李清照「暗香浮动月黄昏」的朦胧美学解构为更细腻的嗅觉叙事。香气穿透纱帷的瞬间，恍见晏几道「犹恐相逢是梦中」的迷离，却以「透」字的穿透力刺破时空结界。

次句「玉簟欹枕冷月华」暗藏南唐后主的亡国遗韵。李煜「罗衾不耐五更寒」的凄楚，在此化作更普世的生命寒意——玉簟的凉意非止温度，更是《霓裳羽衣曲》残谱在月光下泛出的冷辉。

转句「春风不解怜花情」以拟人笔法刺破自然假面。杜甫「感时花溅泪」的家国悲悯，在此退守为个体的存在困境——春风不再是《诗经》「凯风自南」的慈母意象，而成了摧折美好的无形之手。

结句「犹自吹落梦中花」如焦墨点苔般完成哲学升华。李商隐「春心莫共花争发」的警醒，在此升华为更残酷的认知：不仅现实中的花朵飘零，连梦境中的美好亦被春风劫掠。这「梦中花」的意象，既是对庄周梦蝶的当代重释，又是对《红楼梦》「千红一窟」命运谶语的诗意呼应，在花瓣坠落的弧线里，刻画出江南文化中永恒的缺憾美学。

---

## 春陌

> 欲将红豆寄相思，横塘等候兰桡迟。
> 犹记与卿携手处，曾是陌上熏香时。

———庚寅年·春·魏书

![春陌](../images/春陌.jpg)

### 赏析

此诗以含蓄典雅的笔触抒写相思怀旧之情，深得古典诗词意象运用之精髓。

"欲将红豆寄相思"化用古典诗歌经典意象。红豆自王维《相思》"红豆生南国，春来发几枝"起，便成为寄托相思的永恒符号。此处以"寄"字勾连物与情，将无形思念具象为可传递的信物，承袭了"托物寄情"的婉约传统。

"横塘等候兰桡迟"融合地理意象与古典意象。"横塘"化用贺铸《青玉案》"凌波不过横塘路，但目送，芳尘去"，常指代离别之地；兰桡典出《楚辞·湘君》"桂棹兮兰枻"，以香木船桨暗喻所候之人身份尊贵（如屈原待湘夫人），使"等候"超越俗世离别，升华为精神贵族的守望。

后两句通过"犹记""曾是"构建今昔对比：昔日"陌上携手"的旖旎春光，与当下"横塘独候"的寂寥形成张力。这种"乐景衬哀情"的手法，恰如李商隐"此情可待成追忆，只是当时已惘然"的时空苍茫感，深化了物是人非的悲怆。

全诗未直抒愁苦，而以"寄红豆""兰桡迟"等含蓄动作隐喻相思。尤其"迟"字三重意蕴：既写等待时长，又喻佳人难至，更暗含命运无常之叹。此诗深得唐人绝句"含蓄蕴藉"之髓，兼采宋词"细腻婉转"之长，用古典语汇诉说永恒相思。

> 失去灵魂的躯体

> 耳畔传来的梵音
> 悲悯中隐藏着疯狂

![长相思](../images/长相思.jpg)

### 赏析

秋心莫渡江：一阕古典与现代交融的深情绝唱

这首《长相思》以烟雨江天为画布，用墨透诗厚的笔触勾勒出穿越时空的相思长卷。魏东坡巧妙化用宋词婉约风骨与元曲抒情特质，在冷月渔火的千年孤寂中，构建起一座横亘于古典美学与现代诗性之间的情感桥梁。

**意象的时空交响**——上阕"烟雨未收泛孤舟"开篇即铺陈出宋画般的氤氲意境，将李煜"一江春水向东流"的亘古苍茫与张继"江枫渔火对愁眠"的孤寂清冷熔铸成新的诗性时空。"冷月却如钩上心头"既暗合李后主"寂寞梧桐深院锁清秋"的凄婉，又通过"钩"字激活了柳永"执手相看泪眼"的离愁质感，使自然物象化作穿刺心灵的修辞利器。暮色青山与断肠离殇的并置，将谢朓"余霞散成绮"的山水美学转化为"此恨绵绵无绝期"的情感张力。

**情感的复调叙事**——下阕以"柴扉轻叩"为转轴，在虚实相生的结构中展开双重叙事。明眸美目的古典邂逅，令人联想到苏轼"小轩窗正梳妆"的生死之恋，却在"情不知所起"的元曲式独白中，将汤显祖《牡丹亭》的至情哲学熔铸为"墨透诗厚"的当代情感宣言。特别是"青丝白首今生为你绕指柔"，既延续了汉乐府"蒲苇纫如丝"的柔韧意象，又赋予金属锻造的现代工业质感，使古典柔情获得跨时代的强度。

**语言的淬炼新生**——"秋心莫渡江"作为诗眼，将李清照"载不动许多愁"的船载意象，创新为更具阻隔感的江心孤影。这种将愁绪具象化为空间阻隔的修辞策略，与苏轼"不思量自难忘"的潜意识书写形成隔代对话。而"苦酒微醺入喉"的痛感美学，既承接了李白"举杯消愁愁更愁"的酒精哲学，又以"醉眼朦胧看不透"的现代性迷茫，解构了陶渊明"悠然见南山"的古典超脱。

此词最动人的，是在"暮钟声催岁月快走"的时光焦虑中，仍执着于"江心孤影留"的守望姿态。这让人想起苏轼"一蓑烟雨任平生"的豁达，却又在"倦怠红尘"的现代性困顿里，生长出更为复杂的生命况味。当古典的渔火照亮当代人的情感江面，魏东坡用诗性智慧证明：真正的深情，终将在时光长河里淬炼成永恒的星光。

## 秋夜词

> 夜色清浅，月明如素，正绛河影下。敛暮霭，寒烟却起，惹情思满帘。正无眠，缓步中庭。久凝伫，听寒声，怜香径。怨无情秋风，吹落花成雪玉阶盈，又舞败叶萧萧，弄尽梧桐影。奈何，叹花易凋零，拈落红，揉碎香魂殒。怅然，携来几觞清酒，邀月共饮。浅酌不胜醉，微醺，知谁家花苑，添香红袖，素手轻弹哀曲，愀然琴音。忍闻杜鹃啼血，凤凰悲鸣。黯然，却见月伴琼楼，风戏流云，欲拾梦中伊人影，终似少年痴心，无处寻。
>
> 渐觉不舍年华向晚，恋皓月婵娟易去。泪暗滴，似梦里，泪眼问蝶，蝶不语。等闲空铃，诉尽幽幽恨意。恨流年似水，最是无情，暗度镜中境。恨一庭凄凉，留我苦吟风月，独揽流萤。恨数点寒星，银河自明，不解风情。
>
> 泪潸然，感旧时罗衫，难耐轻寒，却倦赏肃杀残景，不爱秋韵，明月复照回廊影。

——杭州野生诗人魏东坡

![秋夜词](../images/秋夜词.jpg)

### 赏析

词中"月明如素""梧桐影""落红""流萤"等意象，皆源自古典诗词符号系统。如"弄尽梧桐影"呼应刘崧《秋夜词》"渐见梧桐青叶低"的萧瑟，而"拈落红，揉碎香魂殒"则以黛玉葬花般的痴绝，将"落花"意象从《西厢记》"花落水流红"的浅愁推向生命湮灭的悲怆。银河（绛河）、寒星、琼楼等更构建出天人感应的宇宙视野。

通过"哀曲""杜鹃啼血""凤凰悲鸣""空铃"等声音意象，形成"以声衬寂"的经典手法。琴音之"愀然"暗合刘崧"掩抑冰弦破清悄"的弦语心伤，而"寒声"（秋风、落叶、虫鸣）的铺陈，复现了古典秋声赋的听觉审美维度。

以"怨""叹""怅""恨""泪"为情感脉络，从"怨无情秋风"的物象感发，到"恨流年似水"的哲理喟叹，终至"泪潸然"的生命悲感。这种"因物兴情-情志升华"的结构，深得李清照《声声慢》由"满地黄花"至"怎一个愁字了得"的神髓。

上阕"夜色清浅"至"舞败叶萧萧"为当下实景，"感旧时罗衫"则闪回往昔；下阕"欲拾梦中伊人影"将梦境植入现实，"恨流年似水"又跃入永恒之思。这种时空跳跃近似吴文英词"时空杂糅"技法，而"镜中境"（当下容颜）与"少年痴心"（往昔自我）的对照，更强化了生命易逝的悲感。

以"秋夜"为镜，映照出人类永恒的孤独与抗争：银河垂野而人情微渺，玉阶落花而香魂不灭。在月魄千年的凝视下，诗人以"独揽流萤"的绝美姿态，完成了对无情天道的诗意超越。其词既得周邦彦之典丽、吴文英之奇幻，更在"恨流年似水"的悲慨中，注入现代生命的荒凉质感。此非仿古之赝鼎，实为古典精神在当代语境下的凤凰涅槃。

  "poems/11-shici-lilun.md": `# 关于格律和诗词化用之争

> 文化的生命力在于守正和创新，才能延续文脉生生不息。

---

## 关于格律之争

### 一、古体诗的天然自由

**1.《敕勒歌》（北朝民歌）**

> 敕勒川，阴山下。天似穹庐，笼盖四野。天苍苍，野茫茫，风吹草低见牛羊。

特点：全篇三言、四言、七言混杂，无平仄对仗，却因草原意象与音韵回环成为千古绝唱。

**2.曹操《短歌行》**

> 对酒当歌，人生几何？譬如朝露，去日苦多。

突破：四言诗打破《诗经》复沓结构，以散文化笔法直抒胸臆，开建安风骨先声。

### 二、唐代名家的破格典范

**3.崔颢《黄鹤楼》**

> 昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。

争议：前三联平仄失粘，颔联不对仗，却因气韵贯通被严羽誉为"唐人七律第一"。

**4.杜甫《绝句漫兴九首·其七》**

> 熟知茅斋绝低小，江上燕子故来频。衔泥点污琴书内，更接飞虫打著人。

特例：四句中仅末句合律，以白描手法写日常琐事，展现"拗绝"的鲜活生命力。

### 三、浪漫主义的恣意奔放

**5.李白《蜀道难》**

> 噫吁嚱，危乎高哉！蜀道之难难于上青天！

创新：杂言体自由换韵，三叹九折的句式突破乐府旧题，开创"太白体"狂放诗风。

**6.李贺《李凭箜篌引》**

> 昆山玉碎凤凰叫，芙蓉泣露香兰笑。

异数：全诗24句仅6句合律，通感意象与诡异节奏成就"诗鬼"独特审美。

### 四、民歌乐府的本真之美

**7.《上邪》（汉乐府）**

> 山无陵，江水为竭。冬雷震震，夏雨雪。天地合，乃敢与君绝。

价值：五组悖逆自然的比喻打破任何格律框架，直抵抒情诗的情感巅峰。

**8.王梵志白话诗（唐代）**

> 他人骑大马，我独跨驴子。回顾担柴汉，心下较些子。

意义：以俚俗语言颠覆典雅传统，开辟唐诗通俗化路径。

### 总结：格律与自由的辩证

创作启示：格律是工具而非枷锁，崔颢《黄鹤楼》证明"气盛言宜"胜过机械守律，杜甫33首非律绝句更展现大家突破程式的勇气。**诗歌的本质终归于"情感"的共振，而非形式的绝对规整。**

历史脉络：唐代以前诗歌本无严格格律，近体诗成熟后仍有古体诗并行发展，二者共同构成中华诗学的多元光谱的天然自由。

---

## 关于诗词化用

### 一、盛唐气象的化用重构

**1.王勃"海内存知己，天涯若比邻"**

化用自曹植《赠白马王彪》的"丈夫志四海，万里犹比邻"。王勃将原句的个体壮志升华为超越时空的友情境界，成为送别诗的金句。

**2.苏轼"明月几时有，把酒问青天"**

化用李白《把酒问月》的"青天有月来几时？我今停杯一问之"。苏轼在《水调歌头》中进一步凝练，使意象更具哲学穿透力。

### 二、宋词意境的层叠升华

**3.秦观"斜阳外，寒鸦万点，流水绕孤村"**

化用隋炀帝杨广《野望》的"寒鸦飞数点，流水绕孤村"。秦观通过添加"斜阳外"三字，将原诗的萧瑟转化为苍茫的时空感，成为羁旅词经典意象。

**4.姜夔《扬州慢》中"二十四桥仍在，波心荡冷月无声"**

反用杜牧"二十四桥明月夜"的热闹，以"冷月无声"重构战乱后的凄凉，形成历史纵深对比。

### 三、诗句点化的艺术超越

**5.林逋"疏影横斜水清浅，暗香浮动月黄昏"**

点化五代江为残句"竹影横斜水清浅，桂香浮动月黄昏"，将竹、桂置换为梅，创造咏梅绝唱。

**6.叶绍翁"春色满园关不住，一枝红杏出墙来"**

化用陆游《马上作》"杨柳不遮春色断，一枝红杏出墙头"，通过"关不住"的动态强化生命力，比原句更具反抗性。

### 四、典故反用的哲学突破

**7.苏轼《赤壁赋》"哀吾生之须臾，羡长江之无穷"**

反用《论语》"逝者如斯夫"，将孔子的时间哲思转化为个体生命体验，再引入庄子思想完成超越。

**8.毛泽东"天若有情天亦老，人间正道是沧桑"**

化用李贺"天若有情天亦老"，将原句的悲怆转化为历史规律认知，赋予革命豪情。

### 五、意象嫁接的时空对话

**9.王勃"落霞与孤鹜齐飞，秋水共长天一色"**

化用庾信"落花与芝盖同飞，杨柳共春旗一色"，置换意象后成就滕王阁的永恒秋色。

**10.纳兰性德"一生一代一双人"**

直接引用骆宾王《代女道士王灵妃赠道士李荣》，将道教爱情转化为世俗痴情，深化悲剧性。

### 六、诗眼再造的境界提升

**11.陆游"山重水复疑无路，柳暗花明又一村"**

化用强彦文"远山初见疑无路，曲径徐行渐有村"，通过"柳暗花明"的视觉冲击，强化绝处逢生的顿悟感。

**12.元稹"曾经沧海难为水，除却巫山不是云"**

化用《孟子》"观于海者难为水"，将哲理比喻转化为悼亡情感，开创爱情诗新境界。

---

## 化用手法分类

- **意象置换**：如林逋改"竹影"为"疏影"
- **结构重组**：戴叔伦调整梁武帝诗句顺序增强情感
- **反用其意**：姜夔颠覆杜牧扬州盛景描写
- **哲学升维**：苏轼融合儒道思想重构赤壁意象

---

## 结语

从诗经到汉赋，唐诗到宋词，元曲到现代诗，文化的生命力在于守正和创新，才能延续文脉生生不息。好的诗词必然蕴含深刻的哲学和强烈的感情共鸣，它被芸芸众生接纳而成为经典流传千古，形成新的诗词流派，不好的诗词自然会淹没在历史的尘埃之中。

我们站在后来者的角度看古人的诗词从来不争论合不合理，只体会其中的文学意境之美，但是对同时代的作品总是争论不休，终究无法跳出时代的局限性，也缺少了包容性。春秋时期还有诸子百家争鸣，千年之后只准一花独放了。

人生天地之间，如白驹之过隙，忽然而已。魏东坡生在这个时代，自然会留下魏东坡的文化印记，也曾在这世间走过。

<script>
(function() {
  // ── Elements ──
  const sidebar = document.getElementById('sidebar');
  const navToggle = document.getElementById('nav-toggle');
  const overlay = document.getElementById('overlay');
  const cover = document.getElementById('cover');
  const content = document.getElementById('content');
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');
  const backTop = document.getElementById('back-top');
  const navLinks = sidebar.querySelectorAll('a[data-file]');

  // ── Mobile nav ──
  function closeNav() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
  navToggle.addEventListener('click', () => {
    const open = sidebar.classList.toggle('open');
    overlay.classList.toggle('open', open);
  });
  overlay.addEventListener('click', closeNav);

  // ── Back to top ──
  window.addEventListener('scroll', () => {
    backTop.classList.toggle('visible', window.scrollY > 500);
  });
  backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  // ── Configure marked ──
  marked.setOptions({ breaks: true, gfm: true });

  // ── Fix image paths: ../images/ → ./images/ ──
  function fixImagePaths(html) {
    return html.replace(/src="\.\.\/images\//g, 'src="./images/');
  }

  // ── Render poem content ──
  function renderPoemHTML(rawMd) {
    let html = marked.parse(rawMd);
    html = fixImagePaths(html);

    // Wrap in a container so we can process the structure
    const tmp = document.createElement('div');
    tmp.innerHTML = html;

    // Find all h2 elements and their associated content
    const sections = [];
    let currentSection = null;

    for (const el of Array.from(tmp.children)) {
      if (el.tagName === 'H1') {
        // Category title
        const header = document.createElement('div');
        header.className = 'category-header';
        const h2 = document.createElement('h2');
        h2.textContent = el.textContent;
        header.appendChild(h2);

        // Check if next element is a blockquote (tagline)
        const next = el.nextElementSibling;
        if (next && next.tagName === 'BLOCKQUOTE') {
          const subtitle = document.createElement('p');
          subtitle.className = 'subtitle';
          subtitle.innerHTML = next.innerHTML.replace(/<br>/g, '<br>');
          header.appendChild(subtitle);
          next.remove();
        }
        sections.push({ type: 'header', el: header });
        el.remove();
      } else if (el.tagName === 'H2') {
        // Poem title
        if (currentSection) sections.push(currentSection);
        currentSection = { type: 'poem', title: el.textContent, parts: [] };
        el.remove();
      } else if (currentSection && el.tagName === 'BLOCKQUOTE' && !currentSection.attribution && !currentSection.imageSrc) {
        // Poem text blockquote (capture all stanzas before attribution/image)
        const text = el.innerHTML.replace(/<br\s*\/?>/g, '\n').replace(/<[^>]*>/g, '').trim();
        if (currentSection.poemText) {
          currentSection.poemText += '\n\n' + text;
        } else {
          currentSection.poemText = text;
        }
        el.remove();
      } else if (currentSection && el.tagName === 'P' && el.textContent.startsWith('———')) {
        // Attribution line
        currentSection.attribution = el.textContent.trim();
        el.remove();
      } else if (currentSection && el.tagName === 'P' && el.innerHTML.startsWith('<img')) {
        // Image paragraph
        const img = el.querySelector('img');
        if (img) currentSection.imageSrc = img.getAttribute('src');
        el.remove();
      } else if (currentSection && el.tagName === 'HR') {
        el.remove(); // skip horizontal rules
      } else if (currentSection) {
        // Everything else goes to parts (赏析)
        currentSection.parts.push(el.cloneNode(true));
        el.remove();
      }
    }
    if (currentSection) sections.push(currentSection);

    // Build HTML
    const container = document.createDocumentFragment();

    for (const section of sections) {
      if (section.type === 'header') {
        container.appendChild(section.el);
      } else if (section.type === 'poem') {
        const card = document.createElement('div');
        card.className = 'poem-card';
        card.id = 'poem-' + section.title.replace(/[·•\s]/g, '-');

        // Title
        const h3 = document.createElement('h3');
        h3.textContent = section.title;
        card.appendChild(h3);

        // Poem body (text + image side by side)
        if (section.poemText || section.imageSrc) {
          const body = document.createElement('div');
          body.className = 'poem-body';

          if (section.poemText) {
            const poemDiv = document.createElement('div');
            poemDiv.className = 'poem-text';
            // Determine length class
            const lines = section.poemText.split('\n').length;
            if (lines <= 4) poemDiv.classList.add('short');
            else if (lines <= 8) poemDiv.classList.add('medium');
            poemDiv.textContent = section.poemText;
            body.appendChild(poemDiv);
          }

          if (section.imageSrc) {
            const imgWrap = document.createElement('div');
            imgWrap.className = 'poem-image';
            const img = document.createElement('img');
            img.src = section.imageSrc;
            img.alt = section.title;
            img.loading = 'lazy';
            img.onerror = function() { this.parentElement.style.display = 'none'; };
            imgWrap.appendChild(img);
            body.appendChild(imgWrap);
          }

          card.appendChild(body);
        }

        // Attribution
        if (section.attribution) {
          const attr = document.createElement('p');
          attr.className = 'poem-attribution';
          attr.textContent = section.attribution;
          card.appendChild(attr);
        }

        // Analysis
        if (section.parts.length > 0) {
          const analysis = document.createElement('div');
          analysis.className = 'analysis';
          for (const part of section.parts) {
            // Convert h3 to h4, h4 to h5
            if (part.tagName === 'H3') {
              const h4 = document.createElement('h4');
              h4.innerHTML = part.innerHTML;
              analysis.appendChild(h4);
            } else if (part.tagName === 'H4') {
              const h5 = document.createElement('h5');
              h5.innerHTML = part.innerHTML;
              analysis.appendChild(h5);
            } else {
              // Clean up text content
              if (part.tagName === 'P' && part.textContent.trim().startsWith('---')) continue;
              analysis.appendChild(part);
            }
          }
          card.appendChild(analysis);
        }

        container.appendChild(card);
      }
    }

    return container;
  }

  // ── Render theory page (special handling) ──
  function renderTheoryHTML(rawMd) {
    let html = marked.parse(rawMd);
    html = fixImagePaths(html);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    tmp.className = 'theory-content';

    // Remove H1 and its adjacent blockquote (subtitle)
    const h1 = tmp.querySelector('h1');
    if (h1) {
      const header = document.createElement('div');
      header.className = 'category-header';
      const h2 = document.createElement('h2');
      h2.textContent = h1.textContent;
      header.appendChild(h2);

      let next = h1.nextElementSibling;
      if (next && next.tagName === 'BLOCKQUOTE') {
        const subtitle = document.createElement('p');
        subtitle.className = 'subtitle';
        subtitle.innerHTML = next.innerHTML;
        header.appendChild(subtitle);
        next.remove();
      }
      h1.replaceWith(header);
    }

    // Convert H2 to H3 in theory pages
    tmp.querySelectorAll('h2').forEach(h => {
      const h3 = document.createElement('h3');
      h3.innerHTML = h.innerHTML;
      h.replaceWith(h3);
    });

    return tmp;
  }

  // ── Load and display a category ──
  async function loadCategory(filePath) {
    cover.style.display = 'none';
    content.classList.add('hidden');
    error.classList.remove('visible');
    loading.classList.add('visible');
    content.innerHTML = '';

    try {
      await new Promise(r => setTimeout(r, 10)); // yield for loading spinner
      const rawMd = EMBEDDED_POEMS[filePath];
      if (!rawMd) throw new Error('Poem not found: ' + filePath);

      let rendered;
      if (filePath.includes('shici-lilun')) {
        rendered = renderTheoryHTML(rawMd);
      } else {
        rendered = renderPoemHTML(rawMd);
      }

      content.innerHTML = '';
      content.appendChild(rendered);
      loading.classList.remove('visible');
      content.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      console.error('Load error:', err);
      loading.classList.remove('visible');
      error.classList.add('visible');
      error.textContent = '加载失败: ' + (err.message || err);
    }
  }

  // ── Show cover ──
  function showCover() {
    content.classList.add('hidden');
    error.classList.remove('visible');
    cover.style.display = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── Navigation ──
  navLinks.forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const file = this.getAttribute('data-file');

      // Update active state
      navLinks.forEach(l => l.classList.remove('active'));
      if (file !== 'home') this.classList.add('active');

      if (file === 'home') {
        showCover();
      } else {
        loadCategory(file);
      }

      closeNav();
    });
  });

  // ── Init ──
  // Show cover by default
  cover.style.display = '';
})();
</script>
</body>
</html>
